<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOID ECHOS | Operación Galáctica</title>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Syncopate:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-pink: #ff007a;
            --neon-purple: #bc13fe;
            --bg: #010208;
            --glass: rgba(0, 242, 255, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: radial-gradient(circle at center, #0a192f 0%, #010208 100%);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
        }

        #stars {
            position: fixed;
            inset: 0;
            background: url('https://www.transparenttextures.com/patterns/stardust.png');
            animation: moveStars 150s linear infinite;
            z-index: -1;
        }

        @keyframes moveStars {
            from { background-position: 0 0; }
            to { background-position: 10000px 5000px; }
        }

        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .glitch {
            font-family: 'Orbitron';
            font-size: clamp(3rem, 10vw, 6rem);
            font-weight: 900;
            letter-spacing: 15px;
            text-shadow: 3px 3px var(--neon-pink), -3px -3px var(--neon-blue);
        }

        .login-card {
            background: var(--glass);
            border: 2px solid var(--neon-blue);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(15px);
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.2);
            width: 400px;
            margin-top: 20px;
        }

        .login-input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: rgba(0,0,0,0.7);
            border: 1px solid var(--neon-purple);
            color: var(--neon-blue);
            font-family: 'Orbitron';
            font-size: 0.8rem;
            border-radius: 5px;
        }

        .btn-glow {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-purple));
            border: none;
            color: white;
            font-family: 'Orbitron';
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            text-transform: uppercase;
            margin-top: 10px;
        }

        footer {
            position: absolute;
            bottom: 20px;
            font-family: 'Orbitron';
            font-size: 0.7rem;
            color: #444;
        }
    </style>
</head>
<body>

<div id="stars"></div>

<section class="hero">
    <h1 class="glitch animate__animated animate__pulse animate__infinite">VOID ECHOS</h1>

    <form class="login-card animate__animated animate__backInUp">
        <h3 id="formTitle" style="color:var(--neon-blue);font-family:'Syncopate';font-size:0.9rem;">
            ACCESO AL NEXO
        </h3>

        <input type="email" id="email" class="login-input" placeholder="EMAIL DE OPERATIVO" required>
        <input type="password" id="password" class="login-input" placeholder="CÓDIGO NEURONAL" required>

        <button type="submit" id="btnLogin" class="btn-glow">
            Sincronizar Conciencia
        </button>

        <p style="font-size:0.7rem;margin-top:15px;">
            ¿Sin registro?
            <a href="#" id="btnRegister" style="color:var(--neon-pink);text-decoration:none;">
                Generar Nuevo Cortex
            </a>
        </p>
    </form>
</section>

<footer>VOID ECHOS PROTOCOL v0.95</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = 'https://ojytjhamrmmuaoeflmrh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_oRK9yB9kg3o-x28YP0F9Jw_izkkkEtz';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let modoRegistro = false;

const form = document.querySelector('.login-card');
const title = document.getElementById('formTitle');
const btnLogin = document.getElementById('btnLogin');
const btnRegister = document.getElementById('btnRegister');

form.addEventListener('submit', async (e) => {
    e.preventDefault();

    if (modoRegistro) return;

    const email = emailInput.value;
    const password = passwordInput.value;

    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if (error) alert(error.message);
    else window.location.href = 'perfil.html';
});

btnRegister.addEventListener('click', async (e) => {
    e.preventDefault();

    if (!modoRegistro) {
        modoRegistro = true;

        form.classList.add('animate__flipOutX');
        setTimeout(() => {
            title.innerText = "CREACIÓN DE CONCIENCIA";
            btnLogin.innerText = "Crear Cortex";
            form.classList.remove('animate__flipOutX');
            form.classList.add('animate__flipInX');
        }, 400);

        return;
    }

    const email = emailInput.value;
    const password = passwordInput.value;

    const { error } = await supabaseClient.auth.signUp({ email, password });

    if (error) {
        alert(error.message);
    } else {
        alert("Cortex creado. Ahora sincroniza tu conciencia.");
        modoRegistro = false;
        title.innerText = "ACCESO AL NEXO";
        btnLogin.innerText = "Sincronizar Conciencia";
    }
});

const emailInput = document.getElementById('email');
const passwordInput = document.getElementById('password');
</script>

</body>
</html>
