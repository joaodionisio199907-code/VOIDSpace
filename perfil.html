<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOID ECHOS | Comando Central</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://ojytjhamrmmuaoeflmrh.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_oRK9yB9kg3o-x28YP0F9Jw_izkkkEtz';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function validarAcceso() {
            const { data: { user }, error } = await supabaseClient.auth.getUser();
            if (error || !user) {
                window.location.href = 'index.html';
            }
        }
        validarAcceso();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-purple: #bc13fe;
            --dark-bg: #0a0b10;
            --card-bg: rgba(16, 18, 27, 0.8);
            --wiki-gold: #ffd700;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Share Tech Mono', monospace;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(188, 19, 254, 0.05) 0%, transparent 80%),
                url('https://www.transparenttextures.com/patterns/stardust.png');
        }

        .main-container { display: flex; height: 100vh; padding: 20px; gap: 20px; }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background: var(--card-bg);
            border: 1px solid rgba(0, 242, 255, 0.2);
            border-radius: 15px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(10px);
        }

        .nav-btn {
            background: transparent;
            border: 1px solid rgba(0, 242, 255, 0.1);
            color: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-btn:hover, .nav-btn.active {
            background: rgba(0, 242, 255, 0.1);
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.2);
            transform: translateX(5px);
        }

        /* Content Area */
        .content-area { flex: 1; display: flex; flex-direction: column; gap: 20px; }

        /* Top Bar */
        .top-bar {
            background: var(--card-bg);
            border: 1px solid rgba(0, 242, 255, 0.2);
            border-radius: 15px;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .resource-item { display: flex; flex-direction: column; align-items: center; }
        .res-label { font-size: 0.7rem; color: var(--neon-blue); margin-bottom: 5px; }
        .res-value { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; text-shadow: 0 0 10px var(--neon-blue); }

        /* Game Sections */
        .game-section { display: none; }
        .game-section.active { display: block; }

        /* Building Grid y Cards */
        .building-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            padding: 10px;
        }

        .building-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s;
            position: relative;
        }

        .building-card:hover {
            border-color: var(--neon-blue);
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(0, 242, 255, 0.1);
        }

        .building-img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-bottom: 1px solid rgba(0, 242, 255, 0.2);
        }

        .building-info { padding: 20px; }
        .building-name { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; color: var(--neon-blue); margin-bottom: 5px; }
        .building-lvl { float: right; font-size: 0.8rem; background: var(--neon-blue); color: black; padding: 2px 8px; border-radius: 4px; }
        .building-lore { font-size: 0.8rem; color: #aaa; margin: 15px 0; line-height: 1.4; }

        .btn-upgrade {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            font-family: 'Orbitron', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 5px;
        }

        .btn-upgrade:hover:not(:disabled) {
            background: var(--neon-blue);
            color: black;
            box-shadow: 0 0 20px var(--neon-blue);
        }

        .btn-upgrade:disabled {
            border-color: #444;
            color: #666;
            cursor: not-allowed;
        }

        .btn-completar {
            border-color: #00ff88 !important;
            color: #00ff88 !important;
        }

        .btn-completar:hover {
            background: #00ff88 !important;
            color: black !important;
            box-shadow: 0 0 20px #00ff88 !important;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="sidebar">
            <h2 style="font-family:'Orbitron'; color:var(--neon-blue); margin-bottom:30px; text-align:center;">VOID ECHOS</h2>
            <button class="nav-btn active" onclick="showSection('resources')"><i class="fas fa-microchip"></i> RECURSOS</button>
            <button class="nav-btn" onclick="showSection('research')"><i class="fas fa-flask"></i> INVESTIGACIÓN</button>
            <button class="nav-btn" onclick="showSection('fleet')"><i class="fas fa-rocket"></i> ASTILLERO</button>
            <div style="margin-top:auto;">
                <button class="nav-btn" onclick="supabaseClient.auth.signOut().then(() => window.location.href='index.html')" style="border-color: #ff4444; color: #ff4444;">
                    <i class="fas fa-power-off"></i> DESCONECTAR
                </button>
            </div>
        </div>

        <div class="content-area">
            <div class="top-bar">
                <div class="resource-item">
                    <span class="res-label">FERRUM</span>
                    <span class="res-value" id="res-metal">0</span>
                </div>
                <div class="resource-item">
                    <span class="res-label">SÍLICE</span>
                    <span class="res-value" id="res-silice">0</span>
                </div>
                <div class="resource-item">
                    <span class="res-label">ISÓTOPO-H3</span>
                    <span class="res-value" id="res-deuterio">0</span>
                </div>
                <div class="resource-item">
                    <span class="res-label">ENERGÍA</span>
                    <span class="res-value" id="res-energia" style="color:#ffea00; text-shadow: 0 0 10px #ffea00;">0</span>
                </div>
            </div>

            <div id="sec-resources" class="game-section active">
                <div class="building-grid" id="resources-list"></div>
            </div>

            <div id="sec-research" class="game-section">
                <div class="building-grid" id="research-list"></div>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIGURACIÓN Y DATOS ---
        const game = {
            buildings: [
                { id: 'minaFe', section: 'resources', name: 'Mina de Ferrum', lvl: 1, lore: 'Extractor de mineral ferroso mediante pulsos magnéticos.', img: 'img/minaferrum/lv1/lv1.png' },
                { id: 'minaSi', section: 'resources', name: 'Sintetizador de Sílice', lvl: 1, lore: 'Procesa arena estelar para extraer cristales de alta pureza.', img: 'img/minasilice/lv1/lv1.png' },
                { id: 'minaH3', section: 'resources', name: 'Colector de Isótopo-H3', lvl: 1, lore: 'Extrae Deuterio de las capas atmosféricas gaseosas.', img: 'img/minadeuterio/lv1/lv1.png' },
                { id: 'plantaSolar', section: 'resources', name: 'Matriz Solar', lvl: 1, lore: 'Paneles de grafeno que absorben radiación de la enana blanca.', img: 'img/plantasolar/lv1/lv1.png' },
                { id: 'lab', section: 'research', name: 'Laboratorio Tech', lvl: 1, lore: 'Centro de desarrollo para nuevas tecnologías espaciales.', img: 'img/laboratorio/lv1/lv1.png' }
            ]
        };

        let userResources = { metal: 0, silicio: 0, deuterio: 0, energia: 0 };
        let dbBuildingsCache = [];

        // --- LÓGICA DE INTERFAZ ---
        function showSection(sectionId) {
            document.querySelectorAll('.game-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('sec-' + sectionId).classList.add('active');
            event.currentTarget.classList.add('active');
            renderList(sectionId);
        }

        function mapBuildingId(gameId) {
            const mapping = {
                'minaFe': 'mina_metal',
                'minaSi': 'mina_silicio',
                'minaH3': 'mina_deuterio',
                'plantaSolar': 'planta_solar',
                'lab': 'laboratorio'
            };
            return mapping[gameId] || gameId;
        }

        const getUpgradeCost = (level) => Math.floor(100 * Math.pow(1.5, level - 1));
        const getUpgradeTime = (level) => level === 1 ? 30000 : (level * 60000);

        // --- RENDERIZADO (CORREGIDO) ---
        function renderList(section) {
            const container = document.getElementById(section + '-list');
            if (!container) return;
            container.innerHTML = '';

            const filtered = game.buildings.filter(b => b.section === section);

            filtered.forEach(b => {
                const dbType = mapBuildingId(b.id);
                const dbB = dbBuildingsCache.find(db => db.building_type === dbType) || { level: 1, is_upgrading: false };
                const cost = getUpgradeCost(dbB.level);

                container.innerHTML += `
                    <div class="building-card animate__animated animate__fadeIn">
                        <img src="${b.img}" class="building-img" onerror="this.src='https://via.placeholder.com/300x160/0a0b10/00f2ff?text=${b.name}'">
                        <div class="building-info">
                            <span class="building-lvl">NIVEL ${dbB.level}</span>
                            <h3 class="building-name">${b.name}</h3>
                            <p class="building-lore">${b.lore}</p>
                            <div style="margin-bottom:15px; font-size:0.9rem; color:var(--wiki-gold);">
                                <i class="fas fa-cube"></i> Coste: ${cost.toLocaleString()} Ferrum
                            </div>
                            <button class="btn-upgrade" 
                                    id="btn-upgrade-${dbType}" 
                                    onclick="mejorarEdificio('${b.id}')"
                                    ${dbB.is_upgrading ? 'disabled' : ''}>
                                ${dbB.is_upgrading ? '<i class="fas fa-spinner fa-spin"></i> CONSTRUYENDO...' : 'MEJORAR ESTRUCTURA'}
                            </button>
                        </div>
                    </div>`;
            });
        }

        // --- FUNCIONES DE BASE DE DATOS ---
        async function actualizarRecursosDesdeBD() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) return;
            const { data } = await supabaseClient.from('players').select('*').eq('id', user.id).single();
            if (data) {
                userResources = data;
                document.getElementById('res-metal').innerText = Math.floor(data.metal);
                document.getElementById('res-silice').innerText = Math.floor(data.silicio);
                document.getElementById('res-deuterio').innerText = Math.floor(data.deuterio);
                document.getElementById('res-energia').innerText = data.energia || 0;
            }
        }

        async function syncBuildingsFromSupabase() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            const { data } = await supabaseClient.from('buildings').select('*').eq('user_id', user.id);
            if (data) {
                dbBuildingsCache = data;
                renderList(document.querySelector('.nav-btn.active').innerText.toLowerCase().includes('recursos') ? 'resources' : 'research');
            }
        }

        async function mejorarEdificio(gameId) {
            const dbType = mapBuildingId(gameId);
            const bData = dbBuildingsCache.find(db => db.building_type === dbType);
            const coste = getUpgradeCost(bData ? bData.level : 1);

            if (userResources.metal < coste) {
                alert("Recursos insuficientes");
                return;
            }

            const { data: { user } } = await supabaseClient.auth.getUser();
            const upgradeEnd = new Date(Date.now() + getUpgradeTime(bData ? bData.level : 1)).toISOString();

            // Descontar metal y activar mejora
            await supabaseClient.from('players').update({ metal: userResources.metal - coste }).eq('id', user.id);
            await supabaseClient.from('buildings').update({ is_upgrading: true, upgrade_end: upgradeEnd }).eq('id', bData.id);
            
            await syncBuildingsFromSupabase();
        }

        async function finalizarMejora(dbType) {
            const bData = dbBuildingsCache.find(db => db.building_type === dbType);
            await supabaseClient.from('buildings').update({ 
                level: bData.level + 1, 
                is_upgrading: false, 
                upgrade_end: null 
            }).eq('id', bData.id);
            
            await syncBuildingsFromSupabase();
        }

        function actualizarContadoresMejora() {
            const ahora = new Date();
            dbBuildingsCache.forEach(b => {
                if (b.is_upgrading && b.upgrade_end) {
                    const restante = new Date(b.upgrade_end) - ahora;
                    const btn = document.getElementById(`btn-upgrade-${b.building_type}`);
                    if (btn) {
                        if (restante > 0) {
                            const seg = Math.ceil(restante / 1000);
                            btn.innerText = `TERMINA EN ${seg}s`;
                            btn.disabled = true;
                        } else {
                            btn.innerText = "FINALIZAR OBRA";
                            btn.disabled = false;
                            btn.classList.add('btn-completar');
                            btn.onclick = () => finalizarMejora(b.building_type);
                        }
                    }
                }
            });
        }

        // --- INICIALIZACIÓN ---
        (async () => {
            await actualizarRecursosDesdeBD();
            await syncBuildingsFromSupabase();
            setInterval(actualizarRecursosDesdeBD, 5000);
            setInterval(actualizarContadoresMejora, 1000);
        })();
    </script>
</body>
</html>
