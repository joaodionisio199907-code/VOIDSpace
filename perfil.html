     /* Ajuste del contenedor para que el texto no pise la imagen */

.resource-item {

    position: relative;

    padding-left: 45px !important; 

    display: flex;

    flex-direction: column;

    justify-content: center;

    min-height: 50px;

}



/* El "contenedor" de la imagen con animación de pulso y brillo */

.resource-item::before {

    content: "";

    position: absolute;

    left: 5px;

    top: 50%;

    transform: translateY(-50%);

    width: 32px;

    height: 32px;

    background-size: contain;

    background-repeat: no-repeat;

    background-position: center;

    /* Animación de respiración */

    animation: materialFloat 3s infinite ease-in-out;

    filter: drop-shadow(0 0 5px rgba(0, 242, 255, 0.5));

    z-index: 1;

}



/* Definición de la animación de fondo */

@keyframes materialFloat {

    0%, 100% { 

        transform: translateY(-50%) scale(1); 

        filter: drop-shadow(0 0 5px rgba(0, 242, 255, 0.3));

    }

    50% { 

        transform: translateY(-55%) scale(1.1); 

        filter: drop-shadow(0 0 15px rgba(0, 242, 255, 0.8));

    }

}

    <script>

       

        



        // --- NAVEGACIÓN GENERAL ---

        function showSection(id) {

            document.querySelectorAll('.game-section').forEach(s => s.classList.remove('active'));

            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

            const section = document.getElementById('sec-' + id);

            if(section) section.classList.add('active');

            

            const btn = event?.currentTarget || document.querySelector(`button[onclick="showSection('${id}')"]`);

            if(btn) btn.classList.add('active');



            if(id === 'resources' || id === 'research') renderList(id);

            if(id === 'fleet') { renderAstillero(); loadHangar(); syncShipQueueFromDB(); }

            if(id === 'forum') cargarTemasForo();

        }



    

      





        // --- UTILIDADES ---

        function animarResta(idRes, cantidad) {

            const contenedor = document.getElementById(idRes);

            if (!contenedor) return;

            const flotante = document.createElement('div');

            flotante.className = 'recurso-resta';

            flotante.innerText = `-${Math.floor(cantidad)}`;

            const rect = contenedor.getBoundingClientRect();

            flotante.style.left = `${rect.left + 10}px`;

            flotante.style.top = `${rect.top}px`;

            document.body.appendChild(flotante);

            setTimeout(() => flotante.remove(), 1500);

        }



       

        // --- INICIALIZACIÓN ---

        (async () => {

            await syncBuildingsFromSupabase();

            await actualizarRecursosDesdeBD();

            renderList('resources');

            setInterval(actualizarRecursosDesdeBD, 10000);

        })();





  

    </script>
