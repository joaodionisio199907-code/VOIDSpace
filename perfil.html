<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOID ECHOS | Comando Central</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="anticheat.js"></script>
    <script src="game.js"></script>

    <script>
        const SUPABASE_URL = 'https://ojytjhamrmmuaoeflmrh.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_oRK9yB9kg3o-x28YP0F9Jw_izkkkEtz';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function validarAcceso() {
            const { data: { user }, error } = await supabaseClient.auth.getUser();
            if (error || !user) { window.location.href = 'index.html'; }
        }
        validarAcceso();
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --neon-blue: #00f2ff; --neon-purple: #bc13fe; --dark-bg: #0a0b10; --card-bg: rgba(16, 18, 27, 0.9); }
        body { background-color: var(--dark-bg); color: white; font-family: 'Share Tech Mono', monospace; background-image: url('https://www.transparenttextures.com/patterns/stardust.png'); background-attachment: fixed; margin: 0; }
        
        .main-container { display: flex; min-height: 100vh; padding: 20px; gap: 20px; }
        .sidebar { width: 250px; background: var(--card-bg); border: 1px solid rgba(0, 242, 255, 0.2); border-radius: 15px; padding: 20px; display: flex; flex-direction: column; position: sticky; top: 20px; height: calc(100vh - 40px); }
        .content-area { flex: 1; display: flex; flex-direction: column; gap: 20px; }
        .top-bar { background: rgba(10, 11, 16, 0.95); border: 1px solid rgba(0, 242, 255, 0.2); border-radius: 15px; padding: 15px; display: flex; justify-content: space-around; position: sticky; top: 0; z-index: 100; }
        
        /* Nav Buttons */
        .nav-btn { background: transparent; border: 1px solid rgba(0,242,255,0.1); color: white; padding: 12px; margin-bottom: 8px; border-radius: 8px; cursor: pointer; font-family: 'Orbitron'; text-align: left; transition: 0.3s; width: 100%; }
        .nav-btn.active { border-color: var(--neon-blue); background: rgba(0,242,255,0.1); }
        
        .game-section { display: none; }
        .game-section.active { display: block; }

        /* Tarjetas y Animación de Escaneo */
        .building-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .ship-card { background: rgba(20, 22, 30, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; overflow: hidden; position: relative; }
        .ship-img-container { position: relative; height: 160px; background: #000; }
        .ship-img { width: 100%; height: 100%; object-fit: cover; }
        .scan-effect { position: absolute; width: 100%; height: 2px; background: var(--neon-blue); box-shadow: 0 0 15px var(--neon-blue); animation: scanLine 3s infinite linear; z-index: 2; }
        @keyframes scanLine { 0% { top: 0; } 100% { top: 100%; } }

        /* Cola de Producción */
        .shipyard-layout { display: grid; grid-template-columns: 1fr 320px; gap: 20px; }
        .queue-container { background: var(--card-bg); border: 1px solid var(--neon-purple); padding: 15px; border-radius: 15px; height: fit-content; }
        .queue-item { background: rgba(255,255,255,0.03); margin-bottom: 10px; padding: 12px; border-left: 3px solid var(--neon-purple); border-radius: 4px; }

        /* Resta Roja */
        .recurso-resta { position: fixed; color: #ff4444; font-weight: bold; font-family: 'Orbitron'; animation: flotarResta 1.5s ease-out forwards; z-index: 9999; pointer-events: none; }
        @keyframes flotarResta { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-40px); } }

        /* Foro e Inputs */
        .forum-container { background: var(--card-bg); border: 1px solid rgba(0, 242, 255, 0.2); border-radius: 15px; padding: 20px; }
        .forum-input { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid #333; color: white; padding: 12px; border-radius: 8px; margin-bottom: 10px; }
        .forum-topic-card { background: rgba(255,255,255,0.03); border: 1px solid #222; padding: 15px; border-radius: 8px; margin-bottom: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="sidebar">
            <h2 style="font-family:'Orbitron'; color:var(--neon-blue); text-align:center; margin-bottom:20px;">VOID ECHOS</h2>
            <button class="nav-btn active" onclick="showSection('resources')"><i class="fas fa-microchip"></i> RECURSOS</button>
            <button class="nav-btn" onclick="showSection('research')"><i class="fas fa-flask"></i> INVESTIGACIÓN</button>
            <button class="nav-btn" onclick="showSection('fleet')"><i class="fas fa-rocket"></i> ASTILLERO</button>
            <button class="nav-btn" onclick="showSection('forum')"><i class="fas fa-comments"></i> FORO</button>
            <div style="margin-top:auto;">
                <button class="nav-btn" onclick="abrirAjustesPerfil()"><i class="fas fa-user-circle"></i> PERFIL</button>
                <button class="nav-btn" onclick="supabaseClient.auth.signOut().then(()=>window.location.href='index.html')" style="color:var(--danger);"><i class="fas fa-power-off"></i> SALIR</button>
            </div>
        </div>

        <div class="content-area">
            <div class="top-bar">
                <div id="cont-metal">FERRUM: <span id="res-metal">0</span></div>
                <div id="cont-silice">SÍLICE: <span id="res-silice">0</span></div>
                <div id="cont-deuterio">ISÓTOPO-H3: <span id="res-deuterio">0</span></div>
            </div>

            <div id="sec-resources" class="game-section active">
                <div class="building-grid" id="resources-list"></div>
            </div>

            <div id="sec-research" class="game-section">
                <div class="building-grid" id="research-list"></div>
            </div>

            <div id="sec-fleet" class="game-section">
                <div class="shipyard-layout">
                    <div>
                        <div class="building-grid" id="fleet-list-container"></div>
                        <h3 style="font-family:Orbitron; color:var(--neon-blue); margin-top:30px;">HANGAR</h3>
                        <div id="hangar-grid" class="hangar-grid" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap:10px;"></div>
                    </div>
                    <div class="queue-container">
                        <h3 style="font-family:Orbitron; font-size:0.8rem; color:var(--neon-purple);">PRODUCCIÓN EN CURSO</h3>
                        <div id="ship-queue-list"></div>
                    </div>
                </div>
            </div>

            <div id="sec-forum" class="game-section">
                <div class="forum-container">
                    <div id="forum-list-view">
                        <button class="nav-btn" onclick="mostrarCrearTema()" style="width:auto; margin-bottom:15px;">NUEVO TEMA</button>
                        <div id="topics-container"></div>
                    </div>
                    <div id="view-topic-detail" style="display:none;">
                        <button onclick="cerrarDetalleTema()" class="nav-btn" style="width:auto;">VOLVER</button>
                        <div id="topic-content-full"></div>
                        <div id="replies-container"></div>
                        <textarea id="reply-text" class="forum-input" placeholder="Responder..."></textarea>
                        <button onclick="enviarRespuesta()" class="nav-btn">ENVIAR</button>
                    </div>
                    <div id="modal-new-topic" style="display:none;">
                        <input id="topic-title-input" class="forum-input" placeholder="Título">
                        <textarea id="topic-body-input" class="forum-input" placeholder="Mensaje"></textarea>
                        <button onclick="guardarNuevoTema()" class="nav-btn">PUBLICAR</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const NAVES_DISPONIBLES = [
            { id: 'cazador_l', name: 'CAZADOR LIGERO', metal: 3000, silicio: 1000, time: 15, img: 'img/ships/interceptorarpía/interceptorarpía.png' },
            { id: 'carguero_p', name: 'CARGUERO PEQUEÑO', metal: 2000, silicio: 2000, time: 25, img: 'img/ships/interceptorarpía/johnscargo1.png' }
        ];

        let shipQueue = [];
        let shipTimerInterval = null;

        // --- NAVEGACIÓN ---
        function showSection(id) {
            document.querySelectorAll('.game-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('sec-' + id).classList.add('active');
            if(id === 'fleet') { renderAstillero(); loadHangar(); syncShipQueueFromDB(); }
            if(id === 'forum') { cargarTemasForo(); }
        }

        // --- ANIMACIÓN RESTA ---
        function animarResta(idPadre, cantidad) {
            const padre = document.getElementById(idPadre);
            if (!padre) return;
            const rect = padre.getBoundingClientRect();
            const el = document.createElement('div');
            el.className = 'recurso-resta';
            el.innerText = `-${cantidad}`;
            el.style.left = rect.left + "px";
            el.style.top = rect.top + "px";
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1500);
        }

        // --- ASTILLERO ---
        function renderAstillero() {
            const container = document.getElementById('fleet-list-container');
            container.innerHTML = NAVES_DISPONIBLES.map(ship => `
                <div class="ship-card">
                    <div class="ship-img-container"><div class="scan-effect"></div><img src="${ship.img}" class="ship-img"></div>
                    <div class="ship-info">
                        <h4 style="color:var(--neon-blue)">${ship.name}</h4>
                        <p style="font-size:0.7rem">M: ${ship.metal} | S: ${ship.silicio}</p>
                        <input type="number" id="qty-${ship.id}" value="1" min="1" class="forum-input" style="width:60px; display:inline-block">
                        <button class="nav-btn" onclick="ordenarNave('${ship.id}')" style="width:auto; display:inline-block">CONSTRUIR</button>
                    </div>
                </div>
            `).join('');
        }

        async function ordenarNave(id) {
            const input = document.getElementById(`qty-${id}`);
            const qty = parseInt(input.value);
            
            // ANTI-CHEAT: Bloquear negativos
            if (typeof AntiCheat !== 'undefined' && !AntiCheat.isValidAmount(qty)) return alert("Cantidad no válida");
            if (qty <= 0) return;

            const ship = NAVES_DISPONIBLES.find(s => s.id === id);
            const costM = ship.metal * qty;
            const costS = ship.silicio * qty;

            if (userResources.metal >= costM && userResources.silicio >= costS) {
                const { data: { user } } = await supabaseClient.auth.getUser();
                
                // Resta inmediata
                const { error } = await supabaseClient.from('players').update({
                    metal: userResources.metal - costM,
                    silicio: userResources.silicio - costS
                }).eq('id', user.id);

                if (error) return;

                animarResta('cont-metal', costM);
                animarResta('cont-silice', costS);
                userResources.metal -= costM;
                userResources.silicio -= costS;
                if (typeof actualizarInterfazRecursos === 'function') actualizarInterfazRecursos();

                // Lógica de cola finish_at
                let baseTime = new Date();
                if (shipQueue.length > 0) baseTime = new Date(shipQueue[shipQueue.length-1].finish_at);
                const finishAt = new Date(baseTime.getTime() + (ship.time * qty * 1000)).toISOString();

                await supabaseClient.from('ship_queue').insert([{
                    user_id: user.id, ship_id: ship.id, quantity: qty, finish_at: finishAt
                }]);

                syncShipQueueFromDB();
            } else { alert("Recursos insuficientes"); }
        }

        async function syncShipQueueFromDB() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            const { data } = await supabaseClient.from('ship_queue').select('*').eq('user_id', user.id).order('finish_at', { ascending: true });
            shipQueue = data || [];
            updateShipQueueUI();
            if (shipQueue.length > 0 && !shipTimerInterval) processShipQueue();
        }

        function updateShipQueueUI() {
            const container = document.getElementById('ship-queue-list');
            container.innerHTML = shipQueue.length === 0 ? "Astillero libre" : shipQueue.map((q, i) => `
                <div class="queue-item">
                    <b>${q.quantity}x ${q.ship_id}</b><br>
                    <small id="timer-${q.id}">${i === 0 ? 'Calculando...' : 'En espera'}</small>
                </div>
            `).join('');
        }

        function processShipQueue() {
            if (shipQueue.length === 0) return;
            shipTimerInterval = setInterval(async () => {
                const current = shipQueue[0];
                const restante = Math.floor((new Date(current.finish_at) - new Date()) / 1000);
                const txt = document.getElementById(`timer-${current.id}`);
                if (txt) txt.innerText = `${restante}s restantes`;

                if (restante <= 0) {
                    clearInterval(shipTimerInterval);
                    shipTimerInterval = null;
                    await registrarNaveEnBD(current.ship_id, current.quantity);
                    await supabaseClient.from('ship_queue').delete().eq('id', current.id);
                    syncShipQueueFromDB();
                    loadHangar();
                }
            }, 1000);
        }

        async function registrarNaveEnBD(shipId, quantity) {
            const { data: { user } } = await supabaseClient.auth.getUser();
            const { data: existing } = await supabaseClient.from('user_fleet').select('*').eq('user_id', user.id).eq('ship_id', shipId).single();
            if (existing) {
                await supabaseClient.from('user_fleet').update({ quantity: existing.quantity + quantity }).eq('id', existing.id);
            } else {
                await supabaseClient.from('user_fleet').insert([{ user_id: user.id, ship_id: shipId, quantity: quantity }]);
            }
        }

        async function loadHangar() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            const { data: fleet } = await supabaseClient.from('user_fleet').select('*').eq('user_id', user.id);
            const container = document.getElementById('hangar-grid');
            container.innerHTML = (fleet || []).map(f => `<div style="background:#111; padding:10px; border-radius:5px; border:1px solid #333; text-align:center;"><b>${f.ship_id}</b><br>${f.quantity}</div>`).join('');
        }

        // --- SISTEMA DE FORO (RESTAURADO) ---
        async function cargarTemasForo() {
            const { data } = await supabaseClient.from('forum_topics').select('*').order('created_at', { ascending: false });
            document.getElementById('topics-container').innerHTML = (data || []).map(t => `
                <div class="forum-topic-card" onclick="verDetalleTema('${t.id}')">
                    <h4>${t.title}</h4><small>Por: ${t.author_name}</small>
                </div>
            `).join('');
        }
        
        // ... (Aquí irían el resto de tus funciones de Foro y Perfil que ya tenías) ...

        // --- INICIALIZACIÓN ---
        (async () => {
            if (typeof syncBuildingsFromSupabase === 'function') await syncBuildingsFromSupabase();
            if (typeof actualizarRecursosDesdeBD === 'function') await actualizarRecursosDesdeBD();
            setInterval(() => { if(typeof actualizarRecursosDesdeBD === 'function') actualizarRecursosDesdeBD(); }, 10000);
        })();
    </script>
</body>
</html>
