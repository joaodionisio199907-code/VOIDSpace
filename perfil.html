<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOID ECHOS | Comando Central</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    
    <style>
        /* CSS DE RECURSOS */
        .resource-item { position: relative; padding-left: 45px !important; display: flex; flex-direction: column; justify-content: center; min-height: 50px; }
        .resource-item::before { content: ""; position: absolute; left: 5px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; background-size: contain; background-repeat: no-repeat; background-position: center; animation: materialFloat 3s infinite ease-in-out; filter: drop-shadow(0 0 5px rgba(0, 242, 255, 0.5)); z-index: 1; }
        @keyframes materialFloat { 0%, 100% { transform: translateY(-50%) scale(1); filter: drop-shadow(0 0 5px rgba(0, 242, 255, 0.3)); } 50% { transform: translateY(-55%) scale(1.1); filter: drop-shadow(0 0 15px rgba(0, 242, 255, 0.8)); } }
        #cont-metal::before { background-image: url('img/minaferrum/mineral/ferrum.png'); }
        #cont-silice::before { background-image: url('img/SILICE/silice.png'); }
        #cont-deuterio::before { background-image: url('img/isotopoh3/isotopoh3.png'); }

        /* ESTILOS GENERALES */
        :root { --neon-blue: #00f2ff; --neon-purple: #bc13fe; --dark-bg: #0a0b10; --card-bg: rgba(16, 18, 27, 0.9); --danger: #ff4444; }
        body { background-color: var(--dark-bg); color: white; font-family: 'Share Tech Mono', monospace; background-image: url('https://www.transparenttextures.com/patterns/stardust.png'); background-attachment: fixed; margin: 0; }
        .main-container { display: flex; min-height: 100vh; padding: 20px; gap: 20px; }
        .sidebar { width: 250px; background: var(--card-bg); border: 1px solid rgba(0, 242, 255, 0.2); border-radius: 15px; padding: 20px; display: flex; flex-direction: column; position: sticky; top: 20px; height: calc(100vh - 40px); }
        .content-area { flex: 1; display: flex; flex-direction: column; gap: 20px; }
        .top-bar { background: rgba(10, 11, 16, 0.95); border: 1px solid rgba(0, 242, 255, 0.2); border-radius: 15px; padding: 15px; display: flex; justify-content: space-around; position: sticky; top: 0; z-index: 90; }
        .nav-btn { background: transparent; border: 1px solid rgba(0,242,255,0.1); color: white; padding: 12px; margin-bottom: 8px; border-radius: 8px; cursor: pointer; font-family: 'Orbitron'; text-align: left; transition: 0.3s; width: 100%; }
        .nav-btn.active { border-color: var(--neon-blue); background: rgba(0,242,255,0.1); }
        .game-section { display: none; }
        .game-section.active { display: block; }
        .building-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .recurso-resta { position: absolute; color: #ff4444; font-weight: bold; font-family: 'Orbitron'; animation: flotarResta 1.5s ease-out forwards; z-index: 1000; }
        @keyframes flotarResta { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-50px); } }
        /* ... el resto de tus estilos del astillero y foro ... */
        .shipyard-layout { display: grid; grid-template-columns: 1fr 350px; gap: 20px; }
        .queue-container { background: var(--card-bg); border: 1px solid var(--neon-purple); padding: 15px; border-radius: 15px; }
        .forum-input { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid #333; color: white; padding: 12px; border-radius: 8px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="sidebar">
            <h2 style="font-family:'Orbitron'; color:var(--neon-blue); text-align:center; margin-bottom:20px;">VOID ECHOS</h2>
            <button class="nav-btn active" onclick="showSection('resources')"><i class="fas fa-microchip"></i> RECURSOS</button>
            <button class="nav-btn" onclick="showSection('research')"><i class="fas fa-flask"></i> INVESTIGACIÓN</button>
            <button class="nav-btn" onclick="showSection('fleet')"><i class="fas fa-rocket"></i> ASTILLERO</button>
            <button class="nav-btn" onclick="showSection('forum')"><i class="fas fa-comments"></i> FORO ESTELAR</button>
            <div style="margin-top:auto;">
                <button class="nav-btn" onclick="abrirAjustesPerfil()"><i class="fas fa-user-circle"></i> PERFIL</button>
                <button class="nav-btn" onclick="supabaseClient.auth.signOut().then(() => window.location.href='index.html')" style="color:#ff4444; border-color:#ff4444;">
                    <i class="fas fa-power-off"></i> SALIR
                </button>
            </div>
        </div>

        <div class="content-area">
            <div class="top-bar">
                <div class="resource-item" id="cont-metal">
                    <span style="font-size:0.6rem; color:var(--neon-blue);">FERRUM</span><br>
                    <span class="res-value" id="res-metal">0</span>
                </div>
                <div class="resource-item" id="cont-silice">
                    <span style="font-size:0.6rem; color:var(--neon-blue);">SÍLICE</span><br>
                    <span class="res-value" id="res-silice">0</span>
                </div>
                <div class="resource-item" id="cont-deuterio">
                    <span style="font-size:0.6rem; color:var(--neon-blue);">ISÓTOPO-H3</span><br>
                    <span class="res-value" id="res-deuterio">0</span>
                </div>
            </div>

            <div id="sec-resources" class="game-section active">
                <div class="building-grid" id="resources-list"></div>
            </div>

            <div id="sec-research" class="game-section">
                <div class="building-grid" id="research-list"></div>
            </div>

            <div id="sec-fleet" class="game-section">
                <div class="shipyard-layout">
                    <div>
                        <div class="building-grid" id="fleet-list-container"></div>
                        <div class="hangar-section">
                            <h3 style="font-family:Orbitron; font-size:0.9rem; color:var(--neon-blue);"><i class="fas fa-warehouse"></i> HANGAR</h3>
                            <div id="hangar-grid" class="hangar-grid"></div>
                        </div>
                    </div>
                    <div class="side-panel">
                        <div class="queue-container">
                            <h3 style="font-family:'Orbitron'; font-size:0.8rem; color:var(--neon-purple);"><i class="fas fa-tools"></i> COLA</h3>
                            <div id="ship-queue-list"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="sec-forum" class="game-section">
                <div class="forum-container">
                    <div id="forum-list-view">
                        <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
                            <h2 style="font-family:'Orbitron'; color:var(--neon-blue);">TERMINAL DE DATOS</h2>
                            <button class="nav-btn" onclick="mostrarCrearTema()" style="width:auto;">NUEVO TEMA</button>
                        </div>
                        <div id="topics-container"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-perfil" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:2000; align-items:center; justify-content:center;">
        <div style="background:var(--card-bg); padding:30px; border-radius:15px; border:1px solid var(--neon-blue); width:400px;">
            <h3 style="font-family:'Orbitron'; color:var(--neon-blue); margin-bottom:15px;">PERFIL DE OPERATIVO</h3>
            <input type="text" id="edit-nickname" class="forum-input" placeholder="Nuevo Nickname">
            <button class="nav-btn" onclick="guardarPerfil()">ACTUALIZAR</button>
            <button class="nav-btn" onclick="cerrarAjustesPerfil()" style="border-color:#ff4444;">CERRAR</button>
        </div>
    </div>

    <script>
        // Inicialización de Supabase y Validación
        const SUPABASE_URL = 'https://ojytjhamrmmuaoeflmrh.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_oRK9yB9kg3o-x28YP0F9Jw_izkkkEtz';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        (async function validarAcceso() {
            const { data: { user }, error } = await supabaseClient.auth.getUser();
            if (error || !user) { window.location.href = 'index.html'; }
        })();
    </script>

    <script src="game.js"></script>
    <script src="anticheat.js"></script>
    <script src="astillero.js"></script>
    <script src="foro.js"></script>
    <script src="perfil.js"></script>

    <script>
        // Lógica de navegación
        function showSection(id) {
            document.querySelectorAll('.game-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('sec-' + id).classList.add('active');
            
            if(id === 'resources' || id === 'research') renderList(id);
            if(id === 'fleet') { renderAstillero(); loadHangar(); syncShipQueueFromDB(); }
            if(id === 'forum') cargarTemasForo();
        }

        // Utilidades
        function animarResta(idRes, cantidad) {
            const contenedor = document.getElementById(idRes);
            if (!contenedor) return;
            const flotante = document.createElement('div');
            flotante.className = 'recurso-resta';
            flotante.innerText = `-${Math.floor(cantidad)}`;
            const rect = contenedor.getBoundingClientRect();
            flotante.style.left = `${rect.left + 10}px`;
            flotante.style.top = `${rect.top}px`;
            document.body.appendChild(flotante);
            setTimeout(() => flotante.remove(), 1500);
        }

        // Inicio del juego
        window.onload = async () => {
            await syncBuildingsFromSupabase();
            await actualizarRecursosDesdeBD();
            renderList('resources');
            setInterval(actualizarRecursosDesdeBD, 10000);
        };
    </script>
</body>
</html>
