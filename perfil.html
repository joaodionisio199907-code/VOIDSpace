<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOID ECHOS | Comando Central</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="anticheat.js"></script>
    <script>
        const SUPABASE_URL = 'https://ojytjhamrmmuaoeflmrh.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_oRK9yB9kg3o-x28YP0F9Jw_izkkkEtz';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function validarAcceso() {
            const { data: { user }, error } = await supabaseClient.auth.getUser();
            if (error || !user) { window.location.href = 'index.html'; }
        }
        validarAcceso();
    </script>
    
    <script src="game.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    
    <style>
        :root { 
            --neon-blue: #00f2ff; 
            --neon-purple: #bc13fe; 
            --dark-bg: #0a0b10; 
            --card-bg: rgba(16, 18, 27, 0.9); 
            --danger: #ff4444;
        }
        .recurso-flotante { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); color: var(--neon-blue); font-weight: bold; animation: flotarArriba 2s ease-out forwards; pointer-events: none; z-index: 100; text-shadow: 0 0 10px rgba(0, 242, 255, 0.8); }
        @keyframes flotarArriba { 0% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -40px); } }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--dark-bg); color: white; font-family: 'Share Tech Mono', monospace; background-image: url('https://www.transparenttextures.com/patterns/stardust.png'); background-attachment: fixed; }
        .main-container { display: flex; min-height: 100vh; padding: 20px; gap: 20px; }
        .sidebar { width: 250px; background: var(--card-bg); border: 1px solid rgba(0, 242, 255, 0.2); border-radius: 15px; padding: 20px; display: flex; flex-direction: column; position: sticky; top: 20px; height: calc(100vh - 40px); }
        .content-area { flex: 1; display: flex; flex-direction: column; gap: 20px; }
        .top-bar { background: rgba(10, 11, 16, 0.95); border: 1px solid rgba(0, 242, 255, 0.2); border-radius: 15px; padding: 15px; display: flex; justify-content: space-around; position: sticky; top: 0; z-index: 90; }
        .nav-btn { background: transparent; border: 1px solid rgba(0,242,255,0.1); color: white; padding: 12px; margin-bottom: 8px; border-radius: 8px; cursor: pointer; font-family: 'Orbitron'; text-align: left; transition: 0.3s; width: 100%; }
        .nav-btn.active { border-color: var(--neon-blue); background: rgba(0,242,255,0.1); }
        .game-section { display: none; }
        .game-section.active { display: block; }
        .building-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        
        /* Estilos foro */
        .forum-container { background: var(--card-bg); border: 1px solid rgba(0, 242, 255, 0.2); border-radius: 15px; padding: 20px; }
        .forum-topic-card { background: rgba(255,255,255,0.03); border: 1px solid #222; padding: 15px; border-radius: 8px; margin-bottom: 10px; cursor: pointer; }
        .forum-input { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid #333; color: white; padding: 12px; border-radius: 8px; margin-bottom: 10px; }
        
        /* Estilos chat */
        #chat-bubble { position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; background: var(--neon-purple); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 1000; }
        #chat-window { position: fixed; bottom: 90px; right: 20px; width: 350px; height: 450px; background: var(--card-bg); border: 1px solid var(--neon-purple); border-radius: 15px; display: none; flex-direction: column; z-index: 1000; }
        #chat-messages { flex: 1; padding: 15px; overflow-y: auto; }

        /* ASTILLERO */
        .shipyard-layout { display: grid; grid-template-columns: 1fr 350px; gap: 20px; }
        .ship-card { background: rgba(20, 22, 30, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); transition: 0.3s; position: relative; border-radius: 10px; overflow: hidden; }
        .ship-card.active:hover { border-color: var(--neon-blue); transform: translateY(-5px); }
        .ship-img-container { position: relative; height: 160px; background: #000; }
        .ship-img { width: 100%; height: 100%; object-fit: cover; }
        .scan-effect { position: absolute; width: 100%; height: 2px; background: var(--neon-blue); box-shadow: 0 0 15px var(--neon-blue); animation: scanLine 3s infinite linear; z-index: 2; }
        @keyframes scanLine { 0% { top: 0; } 100% { top: 100%; } }
        .ship-info { padding: 15px; }
        .queue-container { background: var(--card-bg); border: 1px solid var(--neon-purple); padding: 15px; border-radius: 15px; position: sticky; top: 20px; }
        .queue-item { background: rgba(255,255,255,0.03); margin-bottom: 10px; padding: 12px; border-left: 3px solid var(--neon-purple); position: relative; border-radius: 4px; }
        .ship-progress-bg { height: 4px; background: #111; margin-top: 10px; border-radius: 2px; overflow: hidden; }
        .ship-progress-fill { height: 100%; background: var(--neon-blue); width: 0%; transition: width 1s linear; }

        /* Hangar */
        .hangar-section { margin-top: 30px; background: rgba(0,0,0,0.3); border: 1px solid rgba(0,242,255,0.1); border-radius: 15px; padding: 20px; }
        .hangar-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; margin-top: 15px; }
        .hangar-item { background: var(--card-bg); border: 1px solid #333; padding: 10px; border-radius: 8px; text-align: center; }
        .hangar-item b { color: var(--neon-blue); display: block; font-size: 0.8rem; margin-bottom: 5px; }
        .hangar-item span { font-size: 1.2rem; font-family: 'Orbitron'; }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="sidebar">
            <h2 style="font-family:'Orbitron'; color:var(--neon-blue); text-align:center; margin-bottom:20px;">VOID ECHOS</h2>
            <button class="nav-btn active" onclick="showSection('resources')"><i class="fas fa-microchip"></i> RECURSOS</button>
            <button class="nav-btn" onclick="showSection('research')"><i class="fas fa-flask"></i> INVESTIGACIÓN</button>
            <button class="nav-btn" onclick="showSection('fleet')"><i class="fas fa-rocket"></i> ASTILLERO</button>
            <button class="nav-btn" onclick="showSection('forum')"><i class="fas fa-comments"></i> FORO ESTELAR</button>
            
            <div style="margin-top:auto;">
                <button class="nav-btn" onclick="abrirAjustesPerfil()"><i class="fas fa-user-circle"></i> PERFIL</button>
                <button class="nav-btn" onclick="supabaseClient.auth.signOut().then(() => window.location.href='index.html')" style="color:#ff4444; border-color:#ff4444;">
                    <i class="fas fa-power-off"></i> SALIR
                </button>
            </div>
        </div>

        <div class="content-area">
            <div class="top-bar">
                <div class="resource-item">
                    <span style="font-size:0.6rem; color:var(--neon-blue);">FERRUM</span><br>
                    <span class="res-value" id="res-metal">0</span>
                </div>
                <div class="resource-item">
                    <span style="font-size:0.6rem; color:var(--neon-blue);">SÍLICE</span><br>
                    <span class="res-value" id="res-silice">0</span>
                </div>
                <div class="resource-item">
                    <span style="font-size:0.6rem; color:var(--neon-blue);">ISÓTOPO-H3</span><br>
                    <span class="res-value" id="res-deuterio">0</span>
                </div>
            </div>

            <div id="sec-resources" class="game-section active">
                <div class="building-grid" id="resources-list"></div>
            </div>

            <div id="sec-research" class="game-section">
                <div class="building-grid" id="research-list"></div>
            </div>

            <div id="sec-fleet" class="game-section">
                <div class="shipyard-layout">
                    <div>
                        <div class="building-grid" id="fleet-list-container"></div>
                        <div class="hangar-section">
                            <h3 style="font-family:Orbitron; font-size:0.9rem; color:var(--neon-blue);">
                                <i class="fas fa-warehouse"></i> HANGAR DE LA FLOTA
                            </h3>
                            <div id="hangar-grid" class="hangar-grid"></div>
                        </div>
                    </div>
                    <div class="side-panel">
                        <div class="queue-container">
                            <h3 style="font-family:'Orbitron'; font-size:0.8rem; margin-bottom:15px; color:var(--neon-purple);">
                                <i class="fas fa-tools"></i> COLA DE CONSTRUCCIÓN
                            </h3>
                            <div id="ship-queue-list">
                                <p style="text-align:center; opacity:0.4; font-size:0.8rem; padding:20px;">ASTILLERO INACTIVO</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="sec-forum" class="game-section">
                <div class="forum-container">
                    <div id="forum-list-view">
                        <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
                            <h2 style="font-family:'Orbitron'; color:var(--neon-blue);">TERMINAL DE DATOS</h2>
                            <button class="nav-btn" onclick="mostrarCrearTema()" style="width:auto;">NUEVO TEMA</button>
                        </div>
                        <div id="topics-container"></div>
                    </div>

                    <div id="view-topic-detail" style="display:none;">
                        <button onclick="cerrarDetalleTema()" style="background:none; border:none; color:var(--neon-blue); cursor:pointer; margin-bottom:20px;"><i class="fas fa-arrow-left"></i> VOLVER</button>
                        <div id="topic-content-full"></div>
                        <div id="replies-container" style="margin-top:20px;"></div>
                        <textarea id="reply-text" class="forum-input" placeholder="Escribir respuesta..."></textarea>
                        <button class="nav-btn" onclick="enviarRespuesta()">ENVIAR RESPUESTA</button>
                    </div>

                    <div id="modal-new-topic" style="display:none;">
                        <input type="text" id="topic-title-input" class="forum-input" placeholder="Título...">
                        <textarea id="topic-body-input" class="forum-input" style="height:100px;" placeholder="Mensaje..."></textarea>
                        <button class="nav-btn" onclick="guardarNuevoTema()">PUBLICAR</button>
                        <button class="nav-btn" onclick="cerrarDetalleTema()" style="border-color:red">CANCELAR</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-perfil" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:2000; align-items:center; justify-content:center;">
        <div style="background:var(--card-bg); padding:30px; border-radius:15px; border:1px solid var(--neon-blue); width:400px;">
            <h3 style="font-family:'Orbitron'; color:var(--neon-blue); margin-bottom:15px;">PERFIL DE OPERATIVO</h3>
            <input type="text" id="edit-nickname" class="forum-input" placeholder="Nuevo Nickname">
            <button class="nav-btn" onclick="guardarPerfil()">ACTUALIZAR</button>
            <button class="nav-btn" onclick="cerrarAjustesPerfil()" style="border-color:#ff4444;">CERRAR</button>
        </div>
    </div>

    <script>
// --- VARIABLES Y ESTADO ---
const NAVES_DISPONIBLES = [
    { id: 'cazador_l', name: 'CAZADOR LIGERO', metal: 3000, silicio: 1000, time: 15, img: 'img/ships/interceptorarpía/interceptorarpía.png' },
    { id: 'carguero_p', name: 'CARGUERO PEQUEÑO', metal: 2000, silicio: 2000, time: 25, img: 'img/ships/interceptorarpía/johnscargo1.png' }
];

let shipQueue = [];
let shipTimerInterval = null;
let currentTopicId = null;

// --- NAVEGACIÓN GENERAL ---
function showSection(id) {
    document.querySelectorAll('.game-section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    
    const section = document.getElementById('sec-' + id);
    if(section) section.classList.add('active');
    
    // Activar el botón correcto
    const btn = event?.currentTarget || document.querySelector(`button[onclick="showSection('${id}')"]`);
    if(btn) btn.classList.add('active');

    if(id === 'resources' || id === 'research') renderList(id);
    if(id === 'fleet') { renderAstillero(); loadHangar(); syncShipQueueFromDB(); }
    if(id === 'forum') { cargarTemasForo(); }
}

// --- SISTEMA DE FORO ---
async function cargarTemasForo() {
    const { data, error } = await supabaseClient.from('forum_topics').select('*').order('created_at', { ascending: false });
    const container = document.getElementById('topics-container');
    if(!container) return;
    container.innerHTML = data.map(t => `
        <div class="forum-topic-card" onclick="verDetalleTema('${t.id}')">
            <h4>${t.title}</h4>
            <small>Por: ${t.author_name} | ${new Date(t.created_at).toLocaleDateString()}</small>
        </div>
    `).join('');
}

function mostrarCrearTema() {
    document.getElementById('forum-list-view').style.display = 'none';
    document.getElementById('modal-new-topic').style.display = 'block';
}

async function guardarNuevoTema() {
    const title = document.getElementById('topic-title-input').value;
    const content = document.getElementById('topic-body-input').value;
    const { data: { user } } = await supabaseClient.auth.getUser();
    const { data: p } = await supabaseClient.from('players').select('nickname').eq('id', user.id).single();

    await supabaseClient.from('forum_topics').insert([
        { author_id: user.id, author_name: p.nickname || 'Piloto Desconocido', title, content }
    ]);

    document.getElementById('modal-new-topic').style.display = 'none';
    document.getElementById('forum-list-view').style.display = 'block';
    cargarTemasForo();
}

async function verDetalleTema(id) {
    currentTopicId = id;
    const { data: topic } = await supabaseClient.from('forum_topics').select('*').eq('id', id).single();
    document.getElementById('forum-list-view').style.display = 'none';
    document.getElementById('view-topic-detail').style.display = 'block';
    
    document.getElementById('topic-content-full').innerHTML = `
        <h2 style="color:var(--neon-blue)">${topic.title}</h2>
        <p style="margin:15px 0; border-bottom:1px solid #333; padding-bottom:10px;">${topic.content}</p>
    `;
    cargarRespuestas(id);
}

async function cargarRespuestas(topicId) {
    const { data: replies } = await supabaseClient.from('forum_replies').select('*').eq('topic_id', topicId);
    document.getElementById('replies-container').innerHTML = replies.map(r => `
        <div style="background:rgba(255,255,255,0.05); padding:10px; margin-bottom:5px; border-radius:5px;">
            <b style="color:var(--neon-purple)">${r.author_name}:</b> ${r.content}
        </div>
    `).join('');
}

async function enviarRespuesta() {
    const content = document.getElementById('reply-text').value;
    const { data: { user } } = await supabaseClient.auth.getUser();
    const { data: p } = await supabaseClient.from('players').select('nickname').eq('id', user.id).single();

    await supabaseClient.from('forum_replies').insert([
        { topic_id: currentTopicId, author_name: p.nickname || 'Anónimo', content }
    ]);
    
    document.getElementById('reply-text').value = '';
    cargarRespuestas(currentTopicId);
}

function cerrarDetalleTema() {
    document.getElementById('view-topic-detail').style.display = 'none';
    document.getElementById('modal-new-topic').style.display = 'none';
    document.getElementById('forum-list-view').style.display = 'block';
}

// --- ASTILLERO Y HANGAR ---
function renderAstillero() {
    const container = document.getElementById('fleet-list-container');
    if (!container) return;
    container.innerHTML = NAVES_DISPONIBLES.map(ship => `
        <div class="ship-card active">
            <div class="ship-img-container">
                <div class="scan-effect"></div>
                <img src="${ship.img}" class="ship-img" onerror="this.src='https://via.placeholder.com/150/000?text=NAVE'">
            </div>
            <div class="ship-info">
                <h3 style="color:var(--neon-blue); font-size:0.9rem;">${ship.name}</h3>
                <p style="font-size:0.7rem;">M: ${ship.metal} | S: ${ship.silicio} | T: ${ship.time}s</p>
                <div style="display:flex; gap:5px; margin-top:10px;">
                    <input type="number" id="qty-${ship.id}" class="forum-input" value="1" min="1" style="width:60px; padding:2px 5px;">
                    <button class="nav-btn" onclick="ordenarNave('${ship.id}')" style="font-size:0.65rem; padding:5px;">CONSTRUIR</button>
                </div>
            </div>
        </div>`).join('');
}

async function loadHangar() {
    const container = document.getElementById('hangar-grid');
    if (!container) return;
    const { data: { user } } = await supabaseClient.auth.getUser();
    const { data: fleet } = await supabaseClient.from('user_fleet').select('*').eq('user_id', user.id);

    if (!fleet || fleet.length === 0) {
        container.innerHTML = "<p style='opacity:0.4; font-size:0.8rem;'>Hangar vacío.</p>";
        return;
    }
    container.innerHTML = fleet.map(item => {
        const ship = NAVES_DISPONIBLES.find(s => s.id === item.ship_id) || { name: item.ship_id };
        return `<div class="hangar-item"><b>${ship.name}</b><span>${item.quantity}</span></div>`;
    }).join('');
}

async function ordenarNave(id) {
    const qty = parseInt(document.getElementById(`qty-${id}`).value);
    const ship = NAVES_DISPONIBLES.find(s => s.id === id);
    const costM = ship.metal * qty;
    const costS = ship.silicio * qty;

    if (userResources.metal >= costM && userResources.silicio >= costS) {
        const { data: { user } } = await supabaseClient.auth.getUser();
        await supabaseClient.from('players').update({
            metal: userResources.metal - costM,
            silicio: userResources.silicio - costS
        }).eq('id', user.id);

        let baseTime = new Date();
        if (shipQueue.length > 0) baseTime = new Date(shipQueue[shipQueue.length-1].finish_at);
        const finishAt = new Date(baseTime.getTime() + (ship.time * qty * 1000)).toISOString();

        await supabaseClient.from('ship_queue').insert([{
            user_id: user.id, ship_id: ship.id, quantity: qty, finish_at: finishAt
        }]);

        await actualizarRecursosDesdeBD();
        syncShipQueueFromDB();
    } else { alert("Recursos insuficientes"); }
}

async function syncShipQueueFromDB() {
    const { data: { user } } = await supabaseClient.auth.getUser();
    const { data } = await supabaseClient.from('ship_queue').select('*').eq('user_id', user.id).order('finish_at', { ascending: true });
    shipQueue = data || [];
    updateShipQueueUI();
    if (shipQueue.length > 0) processShipQueue();
}

function updateShipQueueUI() {
    const container = document.getElementById('ship-queue-list');
    if (shipQueue.length === 0) {
        container.innerHTML = "<p style='text-align:center; opacity:0.4; font-size:0.8rem; padding:20px;'>ASTILLERO INACTIVO</p>";
        return;
    }
    container.innerHTML = shipQueue.map((q, i) => `
        <div class="queue-item">
            <div style="font-size:0.8rem;">${q.quantity}x ${q.ship_id}</div>
            ${i === 0 ? '<div class="ship-progress-bg"><div class="ship-progress-fill" id="ship-fill" style="width:50%"></div></div>' : '<div style="font-size:0.6rem; color:gray">En espera...</div>'}
        </div>
    `).join('');
}

function processShipQueue() {
    if (shipQueue.length === 0 || shipTimerInterval) return;
    shipTimerInterval = setInterval(async () => {
        const current = shipQueue[0];
        const restante = Math.floor((new Date(current.finish_at) - new Date()) / 1000);
        if (restante <= 0) {
            clearInterval(shipTimerInterval); shipTimerInterval = null;
            await registrarNaveEnBD(current.ship_id, current.quantity);
            await supabaseClient.from('ship_queue').delete().eq('id', current.id);
            syncShipQueueFromDB(); loadHangar();
        }
    }, 1000);
}

async function registrarNaveEnBD(shipId, quantity) {
    const { data: { user } } = await supabaseClient.auth.getUser();
    const { data: existing } = await supabaseClient.from('user_fleet').select('*').eq('user_id', user.id).eq('ship_id', shipId).single();
    if (existing) {
        await supabaseClient.from('user_fleet').update({ quantity: existing.quantity + quantity }).eq('id', existing.id);
    } else {
        await supabaseClient.from('user_fleet').insert([{ user_id: user.id, ship_id: shipId, quantity: quantity }]);
    }
}

// --- MEJORAS DE EDIFICIOS ---
async function mejorarEdificio(dbType) {
    if (!AntiCheat.isValidAmount(userResources.metal)) return;
    const { data: { user } } = await supabaseClient.auth.getUser();
    const edificioData = dbBuildingsCache.find(db => db.building_type === dbType) || { level: 0 };
    const costo = calcularCosto(dbType, edificioData.level + 1);
    
    if (userResources.metal < costo) return alert("¡No tienes suficiente Ferrum!");

    const { error } = await supabaseClient.from('players').update({ metal: userResources.metal - costo }).eq('id', user.id);

    if (!error) {
        userResources.metal -= costo;
        actualizarInterfazRecursos();
        iniciarTemporizadorVisual(dbType, calcularTiempo(dbType, edificioData.level + 1), edificioData.level + 1);
    }
}

// --- PERFIL ---
function abrirAjustesPerfil() { document.getElementById('modal-perfil').style.display = 'flex'; }
function cerrarAjustesPerfil() { document.getElementById('modal-perfil').style.display = 'none'; }
async function guardarPerfil() {
    const nick = document.getElementById('edit-nickname').value;
    const { data: { user } } = await supabaseClient.auth.getUser();
    await supabaseClient.from('players').update({ nickname: nick }).eq('id', user.id);
    alert("Identidad actualizada.");
    cerrarAjustesPerfil();
}

// --- INICIALIZACIÓN ---
(async () => {
    await syncBuildingsFromSupabase();
    await actualizarRecursosDesdeBD();
    renderList('resources');
    setInterval(actualizarRecursosDesdeBD, 10000);
})();
    </script>
</body>
</html>
