<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOID ECHOS | Comando Central</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://ojytjhamrmmuaoeflmrh.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_oRK9yB9kg3o-x28YP0F9Jw_izkkkEtz';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function validarAcceso() {
            const { data: { user }, error } = await supabaseClient.auth.getUser();
            if (error || !user) {
                window.location.href = 'index.html';
            }
        }
        validarAcceso();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-purple: #bc13fe;
            --dark-bg: #0a0b10;
            --card-bg: rgba(16, 18, 27, 0.9);
            --wiki-gold: #ffd700;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Share Tech Mono', monospace;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(188, 19, 254, 0.05) 0%, transparent 80%),
                url('https://www.transparenttextures.com/patterns/stardust.png');
            background-attachment: fixed;
            min-height: 100vh;
        }

        /* Estilos de Contenedores */
        .main-container { display: flex; flex-direction: row; min-height: 100vh; padding: 20px; gap: 20px; }
        .sidebar { width: 250px; height: calc(100vh - 40px); position: sticky; top: 20px; background: var(--card-bg); border: 1px solid rgba(0, 242, 255, 0.2); border-radius: 15px; padding: 20px; display: flex; flex-direction: column; backdrop-filter: blur(10px); z-index: 100; }
        .content-area { flex: 1; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
        .top-bar { position: sticky; top: 0; background: rgba(10, 11, 16, 0.95); border: 1px solid rgba(0, 242, 255, 0.2); border-radius: 15px; padding: 15px 20px; display: flex; justify-content: space-around; align-items: center; backdrop-filter: blur(15px); z-index: 90; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

        /* --- FORO ESTILOS --- */
        .forum-card { background: var(--card-bg); border: 1px solid rgba(0, 242, 255, 0.2); border-radius: 12px; padding: 20px; }
        .topic-entry { background: rgba(255,255,255,0.03); border: 1px solid #222; border-radius: 8px; padding: 15px; margin-bottom: 12px; cursor: pointer; transition: 0.3s; }
        .topic-entry:hover { border-color: var(--neon-blue); transform: translateX(5px); }
        .topic-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .topic-title { font-family: 'Orbitron'; color: var(--neon-blue); font-size: 1rem; }
        .topic-img-preview { max-width: 100%; height: 200px; object-fit: cover; border-radius: 5px; margin: 10px 0; border: 1px solid #333; }
        .topic-stats { display: flex; gap: 15px; font-size: 0.7rem; color: #888; }
        .like-btn { cursor: pointer; transition: 0.3s; }
        .like-btn:hover { color: var(--neon-purple); }
        .forum-input { width: 100%; background: rgba(0,0,0,0.4); border: 1px solid #444; color: white; padding: 12px; border-radius: 5px; font-family: inherit; margin-bottom: 10px; }
        #image-preview-container img { width: 100px; border-radius: 5px; border: 1px solid var(--neon-blue); }

        @media (max-width: 992px) {
            .main-container { flex-direction: column; padding: 10px; }
            .sidebar { width: 100%; height: auto; position: relative; top: 0; }
        }

        /* --- TUS ESTILOS EXISTENTES (CHAT, BOTONES, ETC) --- */
        #chat-bubble { position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; background: var(--neon-purple); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 0 20px var(--neon-purple); z-index: 1000; transition: transform 0.3s; }
        #chat-window { position: fixed; bottom: 90px; right: 20px; width: 350px; height: 450px; background: var(--card-bg); border: 1px solid var(--neon-purple); border-radius: 15px; display: none; flex-direction: column; backdrop-filter: blur(20px); z-index: 1000; overflow: hidden; }
        #chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; font-size: 0.85rem; }
        .msg { background: rgba(255,255,255,0.05); padding: 8px; border-radius: 5px; border-left: 2px solid var(--neon-purple); }
        .nav-btn { background: transparent; border: 1px solid rgba(0, 242, 255, 0.1); color: white; padding: 15px; margin-bottom: 10px; border-radius: 8px; cursor: pointer; transition: all 0.3s; text-align: left; font-family: 'Orbitron', sans-serif; font-size: 0.8rem; display: flex; align-items: center; gap: 10px; }
        .nav-btn.active { background: rgba(0, 242, 255, 0.1); border-color: var(--neon-blue); }
        .resource-item { display: flex; flex-direction: column; align-items: center; }
        .res-value { font-family: 'Orbitron'; font-size: 1rem; color: var(--neon-blue); }
        .game-section { display: none; }
        .game-section.active { display: block; }
        .building-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .building-card { background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; overflow: hidden; }
        .building-img { width: 100%; height: 160px; object-fit: cover; }
        .building-info { padding: 20px; }
        .avatar-option { width: 100%; cursor: pointer; border: 2px solid transparent; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="sidebar">
            <h2 style="font-family:'Orbitron'; color:var(--neon-blue); margin-bottom:30px; text-align:center; font-size: 1.2rem;">VOID ECHOS</h2>
            <button class="nav-btn active" onclick="showSection('resources')"><i class="fas fa-microchip"></i> RECURSOS</button>
            <button class="nav-btn" onclick="showSection('research')"><i class="fas fa-flask"></i> INVESTIGACIÓN</button>
            <button class="nav-btn" onclick="showSection('forum')"><i class="fas fa-globe-americas"></i> FORO ESTELAR</button>
            
            <div style="margin-top:auto;">
                <button class="nav-btn" onclick="abrirAjustesPerfil()"><i class="fas fa-user-circle"></i> PERFIL</button>
                <button class="nav-btn" onclick="supabaseClient.auth.signOut().then(() => window.location.href='index.html')" style="border-color: #ff4444; color: #ff4444;">
                    <i class="fas fa-power-off"></i> SALIR
                </button>
            </div>
        </div>

        <div class="content-area">
            <div class="top-bar">
                <div class="resource-item"><span class="res-value" id="res-metal">0</span><span style="font-size:0.5rem">FERRUM</span></div>
                <div class="resource-item"><span class="res-value" id="res-silice">0</span><span style="font-size:0.5rem">SÍLICE</span></div>
                <div class="resource-item"><span class="res-value" id="res-deuterio">0</span><span style="font-size:0.5rem">ISÓTOPO-H3</span></div>
            </div>

            <div id="sec-resources" class="game-section active">
                <div class="building-grid" id="resources-list"></div>
            </div>

            <div id="sec-research" class="game-section">
                <div class="building-grid" id="research-list"></div>
            </div>

            <div id="sec-forum" class="game-section">
                <div class="forum-card">
                    <h3 style="font-family:'Orbitron'; color:var(--neon-blue); margin-bottom:20px;">CANAL DE TRANSMISIÓN GENERAL</h3>
                    
                    <div style="background:rgba(0,0,0,0.3); padding:15px; border-radius:10px; margin-bottom:30px; border:1px dashed #444;">
                        <input type="text" id="forum-title" class="forum-input" placeholder="Título de la transmisión...">
                        <textarea id="forum-body" class="forum-input" style="height:80px;" placeholder="Mensaje para la flota..."></textarea>
                        
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <label class="nav-btn" style="margin:0; padding:8px 15px; font-size:0.7rem; cursor:pointer;">
                                <i class="fas fa-image"></i> ADJUNTAR (MAX 720p)
                                <input type="file" id="forum-image" hidden accept="image/*" onchange="previewImage(this)">
                            </label>
                            <button class="nav-btn" onclick="publicarEnForo()" style="margin:0; background:var(--neon-blue); color:black;">TRANSMITIR</button>
                        </div>
                        <div id="image-preview-container" style="margin-top:10px;"></div>
                    </div>

                    <div id="forum-topics-container">
                        </div>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-perfil" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:2000; backdrop-filter: blur(10px); align-items:center; justify-content:center;">
        <div style="background:var(--card-bg); border:1px solid var(--neon-blue); padding:30px; border-radius:15px; width:95%; max-width:420px;">
            <h2 style="font-family:'Orbitron'; color:var(--neon-blue); margin-bottom:20px;">Perfil Operativo</h2>
            <input type="text" id="edit-nickname" class="forum-input">
            <div style="display:flex; gap:10px;">
                <button onclick="guardarPerfil()" class="nav-btn" style="flex:1; background:var(--neon-blue); color:black;">GUARDAR</button>
                <button onclick="cerrarAjustesPerfil()" class="nav-btn" style="flex:1;">CERRAR</button>
            </div>
        </div>
    </div>

    <div id="chat-bubble" onclick="toggleChat()"><i class="fas fa-comments"></i></div>
    <div id="chat-window">
        <div id="chat-header" style="padding:10px; background:rgba(188,19,254,0.2); font-family:'Orbitron'; font-size:0.7rem;">COMMS HUB</div>
        <div id="chat-messages"></div>
    </div>

    <script>
        // --- CONFIGURACIÓN Y NAVEGACIÓN ---
        function showSection(id) {
            document.querySelectorAll('.game-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('sec-'+id).classList.add('active');
            event.currentTarget.classList.add('active');
            if(id === 'forum') cargarTemasForo();
        }

        // --- LÓGICA DEL FORO ---
        let base64Image = "";

        // Función para procesar y redimensionar imagen a 720p baja calidad
        function previewImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        // Redimensionar a max 720px
                        const maxSide = 720;
                        if (width > height) {
                            if (width > maxSide) { height *= maxSide / width; width = maxSide; }
                        } else {
                            if (height > maxSide) { width *= maxSide / height; height = maxSide; }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        // Convertir a base64 con calidad 0.5 (baja)
                        base64Image = canvas.toDataURL('image/jpeg', 0.5);
                        document.getElementById('image-preview-container').innerHTML = `<img src="${base64Image}">`;
                    }
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        async function publicarEnForo() {
            const title = document.getElementById('forum-title').value.trim();
            const body = document.getElementById('forum-body').value.trim();
            if(!title || !body) return alert("Escribe un título y mensaje");

            const { data: { user } } = await supabaseClient.auth.getUser();
            const nick = user.user_metadata.full_name || user.email.split('@')[0];

            const { error } = await supabaseClient.from('foro_temas').insert([{
                titulo: title,
                mensaje: body,
                imagen: base64Image,
                autor_nick: nick,
                autor_id: user.id
            }]);

            if(!error) {
                document.getElementById('forum-title').value = "";
                document.getElementById('forum-body').value = "";
                document.getElementById('image-preview-container').innerHTML = "";
                base64Image = "";
                cargarTemasForo();
            }
        }

        async function cargarTemasForo() {
            const { data, error } = await supabaseClient
                .from('foro_temas')
                .select('*')
                .order('created_at', { ascending: false });

            const container = document.getElementById('forum-topics-container');
            container.innerHTML = "";

            data.forEach(tema => {
                const div = document.createElement('div');
                div.className = "topic-entry animate__animated animate__fadeIn";
                div.innerHTML = `
                    <div class="topic-header">
                        <span class="topic-title">${tema.titulo}</span>
                        <span style="font-size:0.6rem; color:var(--neon-purple)">POR: ${tema.autor_nick}</span>
                    </div>
                    <p style="font-size:0.85rem; opacity:0.8;">${tema.mensaje}</p>
                    ${tema.imagen ? `<img src="${tema.imagen}" class="topic-img-preview">` : ''}
                    <div class="topic-stats">
                        <span class="like-btn" onclick="darLike('${tema.id}', ${tema.likes}, event)">
                            <i class="fas fa-heart"></i> ${tema.likes || 0} APOYO
                        </span>
                        <span><i class="fas fa-clock"></i> ${new Date(tema.created_at).toLocaleDateString()}</span>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        async function darLike(id, currentLikes, event) {
            event.stopPropagation();
            const { error } = await supabaseClient
                .from('foro_temas')
                .update({ likes: (currentLikes || 0) + 1 })
                .eq('id', id);
            
            if(!error) cargarTemasForo();
        }

        // --- TU LÓGICA DE RECURSOS Y CHAT (PARA QUE NO SE PIERDA) ---
        async function actualizarRecursos() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if(!user) return;
            const { data } = await supabaseClient.from('players').select('*').eq('id', user.id).single();
            if(data) {
                document.getElementById('res-metal').innerText = Math.floor(data.metal);
                document.getElementById('res-silice').innerText = Math.floor(data.silicio);
                document.getElementById('res-deuterio').innerText = Math.floor(data.deuterio);
            }
        }

        function toggleChat() {
            const w = document.getElementById('chat-window');
            w.style.display = w.style.display === 'flex' ? 'none' : 'flex';
        }

        // Init
        setInterval(actualizarRecursos, 5000);
        actualizarRecursos();
    </script>
</body>
</html>
