<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOID ECHOS | Comando Central</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://ojytjhamrmmuaoeflmrh.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_oRK9yB9kg3o-x28YP0F9Jw_izkkkEtz';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function validarAcceso() {
            const { data: { user }, error } = await supabaseClient.auth.getUser();
            if (error || !user) {
                window.location.href = 'index.html';
            }
        }
        validarAcceso();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-purple: #bc13fe;
            --dark-bg: #0a0b10;
            --card-bg: rgba(16, 18, 27, 0.9);
            --wiki-gold: #ffd700;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Share Tech Mono', monospace;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(188, 19, 254, 0.05) 0%, transparent 80%),
                url('https://www.transparenttextures.com/patterns/stardust.png');
            background-attachment: fixed;
            min-height: 100vh;
        }

        /* Estilos de Contenedores (Tu código original optimizado) */
        .main-container { display: flex; flex-direction: row; min-height: 100vh; padding: 20px; gap: 20px; }
        .sidebar { width: 250px; height: calc(100vh - 40px); position: sticky; top: 20px; background: var(--card-bg); border: 1px solid rgba(0, 242, 255, 0.2); border-radius: 15px; padding: 20px; display: flex; flex-direction: column; backdrop-filter: blur(10px); z-index: 100; }
        .content-area { flex: 1; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
        .top-bar { position: sticky; top: 0; background: rgba(10, 11, 16, 0.95); border: 1px solid rgba(0, 242, 255, 0.2); border-radius: 15px; padding: 15px 20px; display: flex; justify-content: space-around; align-items: center; backdrop-filter: blur(15px); z-index: 90; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

        @media (max-width: 992px) {
            .main-container { flex-direction: column; padding: 10px; }
            .sidebar { width: 100%; height: auto; position: relative; top: 0; }
            .top-bar { top: 5px; padding: 10px; flex-wrap: wrap; gap: 10px; }
        }

        /* --- ESTILOS DEL CHAT BURBUJA --- */
        #chat-bubble {
            position: fixed; bottom: 20px; right: 20px;
            width: 60px; height: 60px; background: var(--neon-purple);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 0 20px var(--neon-purple); z-index: 1000;
            transition: transform 0.3s;
        }
        #chat-bubble:hover { transform: scale(1.1); }
        
        #chat-window {
            position: fixed; bottom: 90px; right: 20px;
            width: 350px; height: 450px; background: var(--card-bg);
            border: 1px solid var(--neon-purple); border-radius: 15px;
            display: none; flex-direction: column; backdrop-filter: blur(20px);
            z-index: 1000; overflow: hidden;
        }
        #chat-header { padding: 15px; background: rgba(188, 19, 254, 0.2); border-bottom: 1px solid var(--neon-purple); display: flex; justify-content: space-between; font-family: 'Orbitron'; font-size: 0.8rem; }
        #chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; font-size: 0.85rem; }
        .msg { background: rgba(255,255,255,0.05); padding: 8px; border-radius: 5px; border-left: 2px solid var(--neon-purple); }
        .msg b { color: var(--neon-blue); display: block; font-size: 0.7rem; }
        #chat-input-area { padding: 10px; display: flex; gap: 5px; background: rgba(0,0,0,0.3); }
        #chat-input-area input { flex: 1; background: transparent; border: 1px solid #444; color: white; padding: 8px; border-radius: 5px; font-family: inherit; }
        #chat-input-area button { background: var(--neon-purple); border: none; color: white; padding: 0 15px; border-radius: 5px; cursor: pointer; }

        @media (max-width: 480px) {
            #chat-window { width: calc(100% - 40px); height: 60vh; }
        }

        /* Botones y otros estilos tuyos... */
        .nav-btn { background: transparent; border: 1px solid rgba(0, 242, 255, 0.1); color: white; padding: 15px; margin-bottom: 10px; border-radius: 8px; cursor: pointer; transition: all 0.3s; text-align: left; font-family: 'Orbitron', sans-serif; font-size: 0.8rem; display: flex; align-items: center; gap: 10px; }
        .nav-btn:hover, .nav-btn.active { background: rgba(0, 242, 255, 0.1); border-color: var(--neon-blue); box-shadow: 0 0 15px rgba(0, 242, 255, 0.2); }
        .resource-item { display: flex; flex-direction: column; align-items: center; }
        .res-label { font-size: 0.6rem; color: var(--neon-blue); margin-bottom: 2px; }
        .res-value { font-family: 'Orbitron', sans-serif; font-size: 1rem; text-shadow: 0 0 10px var(--neon-blue); }
        .game-section { display: none; }
        .game-section.active { display: block; }
        .building-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; padding-bottom: 40px; }
        .building-card { background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; overflow: hidden; transition: all 0.3s; }
        .building-img { width: 100%; height: 160px; object-fit: cover; }
        .building-info { padding: 20px; }
        .building-name { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; color: var(--neon-blue); }
        .building-lvl { float: right; font-size: 0.7rem; background: var(--neon-blue); color: black; padding: 2px 6px; border-radius: 4px; }
        .building-lore { font-size: 0.8rem; color: #aaa; margin: 15px 0; min-height: 45px; }
        .btn-upgrade { width: 100%; padding: 12px; background: transparent; border: 1px solid var(--neon-blue); color: var(--neon-blue); font-family: 'Orbitron', sans-serif; cursor: pointer; border-radius: 5px; }
        .btn-upgrade:disabled { border-color: #444; color: #666; }
        .btn-completar { border-color: #00ff88 !important; color: #00ff88 !important; }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="sidebar">
            <h2 style="font-family:'Orbitron'; color:var(--neon-blue); margin-bottom:30px; text-align:center; font-size: 1.2rem;">VOID ECHOS</h2>
            <button class="nav-btn active" onclick="showSection('resources')"><i class="fas fa-microchip"></i> RECURSOS</button>
            <button class="nav-btn" onclick="showSection('research')"><i class="fas fa-flask"></i> INVESTIGACIÓN</button>
            <button class="nav-btn" onclick="showSection('fleet')"><i class="fas fa-rocket"></i> ASTILLERO</button>
            <div style="margin-top:auto;">
                <button class="nav-btn" onclick="supabaseClient.auth.signOut().then(() => window.location.href='index.html')" style="border-color: #ff4444; color: #ff4444; width: 100%;">
                    <i class="fas fa-power-off"></i> SALIR
                </button>
            </div>
        </div>

        <div class="content-area">
            <div class="top-bar">
                <div class="resource-item">
                    <span class="res-label">FERRUM</span>
                    <span class="res-value" id="res-metal">0</span>
                </div>
                <div class="resource-item">
                    <span class="res-label">SÍLICE</span>
                    <span class="res-value" id="res-silice">0</span>
                </div>
                <div class="resource-item">
                    <span class="res-label">ISÓTOPO-H3</span>
                    <span class="res-value" id="res-deuterio">0</span>
                </div>
                <div class="resource-item">
                    <span class="res-label">ENERGÍA</span>
                    <span class="res-value" id="res-energia" style="color:#ffea00;">0</span>
                </div>
            </div>

            <div id="sec-resources" class="game-section active">
                <div class="building-grid" id="resources-list"></div>
            </div>
            <div id="sec-research" class="game-section">
                <div class="building-grid" id="research-list"></div>
            </div>
        </div>
    </div>

    <div id="chat-bubble" onclick="toggleChat()"><i class="fas fa-comments"></i></div>
    <div id="chat-window">
        <div id="chat-header">
            <span>CANAL DE COMUNICACIÓN</span>
            <span id="online-count">Online: 1</span>
        </div>
        <div id="chat-messages"></div>
        <div id="chat-input-area">
            <input type="text" id="chat-input" placeholder="Escribir mensaje..." onkeypress="if(event.key==='Enter') sendChatMessage()">
            <button onclick="sendChatMessage()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        // --- LOGICA DEL CHAT ---
       // --- LOGICA DEL CHAT ---
        function toggleChat() {
            const win = document.getElementById('chat-window');
            win.style.display = win.style.display === 'flex' ? 'none' : 'flex';
            if(win.style.display === 'flex') scrollToBottom();
        }

        async function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if(!text) return;
            
            try {
                const { data: { user } } = await supabaseClient.auth.getUser();
                const { error } = await supabaseClient.from('chat_messages').insert([{
                    user_email: user.email.split('@')[0],
                    message: text
                }]);
                
                if (error) throw error;
                input.value = '';
            } catch (err) {
                console.error("Error al enviar:", err.message);
            }
        }

        function loadChatRealtime() {
            // Cargar mensajes de las últimas 5 horas
            const cincoHorasAtras = new Date(Date.now() - 5 * 60 * 60 * 1000).toISOString();

            supabaseClient.from('chat_messages')
                .select('*')
                .gt('created_at', cincoHorasAtras)
                .order('created_at', { ascending: true })
                .then(({ data }) => {
                    if(data) {
                        document.getElementById('chat-messages').innerHTML = '';
                        data.forEach(m => appendMessage(m));
                        scrollToBottom();
                    }
                });

            // Suscripción Realtime Corregida
            supabaseClient
                .channel('public:chat_messages')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_messages' }, 
                payload => {
                    appendMessage(payload.new);
                    scrollToBottom();
                })
                .subscribe();

            // Sistema de Presencia (Online)
            const presenceChannel = supabaseClient.channel('online_users');
            presenceChannel
                .on('presence', { event: 'sync' }, () => {
                    const count = Object.keys(presenceChannel.presenceState()).length;
                    document.getElementById('online-count').innerText = `Online: ${count}`;
                })
                .subscribe(async (status) => {
                    if (status === 'SUBSCRIBED') {
                        const { data: { user } } = await supabaseClient.auth.getUser();
                        await presenceChannel.track({ user: user.email });
                    }
                });
        }

        function appendMessage(msg) {
            const container = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = 'msg animate__animated animate__fadeInUp';
            // Limpiamos el mensaje de posibles scripts maliciosos
            const safeMsg = msg.message.replace(/</g, "&lt;").replace(/>/g, "&gt;");
            div.innerHTML = `<b>${msg.user_email}</b> ${safeMsg}`;
            container.appendChild(div);
        }

        function scrollToBottom() {
            const c = document.getElementById('chat-messages');
            c.scrollTop = c.scrollHeight;
        }

        // --- TU CODIGO ORIGINAL DE LOGICA ---
        const game = {
            buildings: [
                { id: 'minaFe', section: 'resources', name: 'Mina de Ferrum', lore: 'Extractor de mineral ferroso mediante pulsos magnéticos.', img: 'img/minaferrum/lv1/lv1.png' },
                { id: 'minaSi', section: 'resources', name: 'Sintetizador de Sílice', lore: 'Procesa arena estelar para extraer cristales de alta pureza.', img: 'img/SILICE/sintesili.png' },
                { id: 'minaH3', section: 'resources', name: 'Colector de Isótopo-H3', lore: 'Extrae Deuterio de las capas atmosféricas gaseosas.', img: 'img/isotopoh3/ih3recolector.png' },
                { id: 'plantaSolar', section: 'resources', name: 'Matriz Solar', lore: 'Paneles de grafeno que absorben radiación estelar.', img: 'img/plantasolar/lv1/lv1.png' },
                { id: 'lab', section: 'research', name: 'Laboratorio Tech', lore: 'Centro de desarrollo para nuevas tecnologías.', img: 'img/laboratorio/lv1/lv1.png' }
            ]
        };

        let userResources = { metal: 0, silicio: 0, deuterio: 0, energia: 0 };
        let dbBuildingsCache = [];

        function showSection(sectionId) {
            document.querySelectorAll('.game-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('sec-' + sectionId).classList.add('active');
            event.currentTarget.classList.add('active');
            renderList(sectionId);
        }

        function mapBuildingId(gameId) {
            const mapping = { 'minaFe': 'mina_metal', 'minaSi': 'mina_silicio', 'minaH3': 'mina_deuterio', 'plantaSolar': 'planta_solar', 'lab': 'laboratorio' };
            return mapping[gameId] || gameId;
        }

        const getUpgradeCost = (level) => Math.floor(100 * Math.pow(1.5, level - 1));

        function renderList(section) {
            const container = document.getElementById(section + '-list');
            if (!container) return;
            container.innerHTML = '';
            game.buildings.filter(b => b.section === section).forEach(b => {
                const dbType = mapBuildingId(b.id);
                const dbB = dbBuildingsCache.find(db => db.building_type === dbType) || { level: 1, is_upgrading: false };
                const cost = getUpgradeCost(dbB.level);

                container.innerHTML += `
                    <div class="building-card animate__animated animate__fadeIn">
                        <img src="${b.img}" class="building-img" onerror="this.src='https://via.placeholder.com/300x160/0a0b10/00f2ff?text=${b.name}'">
                        <div class="building-info">
                            <span class="building-lvl">NIVEL ${dbB.level}</span>
                            <h3 class="building-name">${b.name}</h3>
                            <p class="building-lore">${b.lore}</p>
                            <div style="margin-bottom:15px; font-size:0.9rem; color:var(--wiki-gold);">
                                <i class="fas fa-cube"></i> Coste: ${cost.toLocaleString()}
                            </div>
                            <button class="btn-upgrade" id="btn-upgrade-${dbType}" onclick="mejorarEdificio('${b.id}')" ${dbB.is_upgrading ? 'disabled' : ''}>
                                ${dbB.is_upgrading ? 'CONSTRUYENDO...' : 'MEJORAR'}
                            </button>
                        </div>
                    </div>`;
            });
        }

        async function actualizarRecursosDesdeBD() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) return;
            const { data } = await supabaseClient.from('players').select('*').eq('id', user.id).single();
            if (data) {
                userResources = data;
                document.getElementById('res-metal').innerText = Math.floor(data.metal);
                document.getElementById('res-silice').innerText = Math.floor(data.silicio);
                document.getElementById('res-deuterio').innerText = Math.floor(data.deuterio);
                document.getElementById('res-energia').innerText = data.energia || 0;
            }
        }

        async function syncBuildingsFromSupabase() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            const { data } = await supabaseClient.from('buildings').select('*').eq('user_id', user.id);
            if (data) {
                dbBuildingsCache = data;
                const activeSec = document.querySelector('.game-section.active').id.replace('sec-', '');
                renderList(activeSec);
            }
        }

        async function mejorarEdificio(gameId) {
            const dbType = mapBuildingId(gameId);
            const bData = dbBuildingsCache.find(db => db.building_type === dbType);
            const coste = getUpgradeCost(bData ? bData.level : 1);
            if (userResources.metal < coste) return alert("Ferrum insuficiente");

            const { data: { user } } = await supabaseClient.auth.getUser();
            const upgradeEnd = new Date(Date.now() + 30000).toISOString();

            await supabaseClient.from('players').update({ metal: userResources.metal - coste }).eq('id', user.id);
            await supabaseClient.from('buildings').update({ is_upgrading: true, upgrade_end: upgradeEnd }).eq('id', bData.id);
            await syncBuildingsFromSupabase();
        }

        async function finalizarMejora(dbType) {
            const bData = dbBuildingsCache.find(db => db.building_type === dbType);
            await supabaseClient.from('buildings').update({ level: bData.level + 1, is_upgrading: false, upgrade_end: null }).eq('id', bData.id);
            await syncBuildingsFromSupabase();
        }

        function actualizarContadoresMejora() {
            const ahora = new Date();
            dbBuildingsCache.forEach(b => {
                if (b.is_upgrading && b.upgrade_end) {
                    const restante = new Date(b.upgrade_end) - ahora;
                    const btn = document.getElementById(`btn-upgrade-${b.building_type}`);
                    if (btn) {
                        if (restante > 0) {
                            btn.innerText = `TERMINA EN ${Math.ceil(restante / 1000)}s`;
                            btn.disabled = true;
                        } else {
                            btn.innerText = "FINALIZAR";
                            btn.disabled = false;
                            btn.classList.add('btn-completar');
                            btn.onclick = () => finalizarMejora(b.building_type);
                        }
                    }
                }
            });
        }

        (async () => {
            await actualizarRecursosDesdeBD();
            await syncBuildingsFromSupabase();
            loadChatRealtime();
            setInterval(actualizarRecursosDesdeBD, 5000);
            setInterval(actualizarContadoresMejora, 1000);
        })();
    </script>
</body>
</html>
