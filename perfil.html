<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOID ECHOS | Comando Central</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://ojytjhamrmmuaoeflmrh.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_oRK9yB9kg3o-x28YP0F9Jw_izkkkEtz';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function validarAcceso() {
            const { data: { user }, error } = await supabaseClient.auth.getUser();
            if (error || !user) {
                window.location.href = 'index.html';
            }
        }
        validarAcceso();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-purple: #bc13fe;
            --dark-bg: #0a0b10;
            --card-bg: rgba(16, 18, 27, 0.9);
            --wiki-gold: #ffd700;
            --neon-green: #00ff88;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Share Tech Mono', monospace;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(188, 19, 254, 0.05) 0%, transparent 80%),
                url('https://www.transparenttextures.com/patterns/stardust.png');
            background-attachment: fixed;
            min-height: 100vh;
        }

        .main-container { display: flex; flex-direction: row; min-height: 100vh; padding: 20px; gap: 20px; }
        .sidebar { width: 250px; height: calc(100vh - 40px); position: sticky; top: 20px; background: var(--card-bg); border: 1px solid rgba(0, 242, 255, 0.2); border-radius: 15px; padding: 20px; display: flex; flex-direction: column; backdrop-filter: blur(10px); z-index: 100; }
        .content-area { flex: 1; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
        .top-bar { position: sticky; top: 0; background: rgba(10, 11, 16, 0.95); border: 1px solid rgba(0, 242, 255, 0.2); border-radius: 15px; padding: 15px 20px; display: flex; justify-content: space-around; align-items: center; backdrop-filter: blur(15px); z-index: 90; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

        /* --- ESTILOS FORO MEJORADO --- */
        .forum-container { background: var(--card-bg); border: 1px solid rgba(0, 242, 255, 0.2); border-radius: 15px; padding: 20px; }
        .forum-topic-card { background: rgba(255,255,255,0.03); border: 1px solid #222; padding: 15px; border-radius: 8px; margin-bottom: 12px; transition: 0.3s; }
        .forum-topic-card:hover { border-color: var(--neon-blue); }
        .topic-img { max-width: 100%; max-height: 300px; border-radius: 8px; margin: 10px 0; border: 1px solid #333; display: block; }
        .like-section { display: flex; align-items: center; gap: 10px; margin-top: 10px; color: var(--neon-purple); cursor: pointer; font-size: 0.8rem; }
        .like-section:hover { filter: brightness(1.2); }
        
        /* --- TUS ESTILOS ORIGINALES --- */
        #chat-bubble { position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; background: var(--neon-purple); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 0 20px var(--neon-purple); z-index: 1000; }
        #chat-window { position: fixed; bottom: 90px; right: 20px; width: 350px; height: 450px; background: var(--card-bg); border: 1px solid var(--neon-purple); border-radius: 15px; display: none; flex-direction: column; z-index: 1000; overflow: hidden; }
        #chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; font-size: 0.85rem; }
        .msg { background: rgba(255,255,255,0.05); padding: 8px; border-radius: 5px; border-left: 2px solid var(--neon-purple); }
        .nav-btn { background: transparent; border: 1px solid rgba(0, 242, 255, 0.1); color: white; padding: 15px; margin-bottom: 10px; border-radius: 8px; cursor: pointer; width: 100%; text-align: left; font-family: 'Orbitron'; font-size: 0.8rem; }
        .nav-btn.active { background: rgba(0, 242, 255, 0.1); border-color: var(--neon-blue); }
        .building-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .building-card { background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; overflow: hidden; }
        .forum-input { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid #333; color: white; padding: 12px; border-radius: 8px; margin-bottom: 10px; font-family: inherit; }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="sidebar">
            <h2 style="font-family:'Orbitron'; color:var(--neon-blue); margin-bottom:30px; text-align:center;">VOID ECHOS</h2>
            <button class="nav-btn active" onclick="showSection('resources')">RECURSOS</button>
            <button class="nav-btn" onclick="showSection('research')">INVESTIGACIÓN</button>
            <button class="nav-btn" onclick="showSection('forum')">FORO ESTELAR</button>
            
            <div style="margin-top:auto;">
                <button class="nav-btn" onclick="abrirAjustesPerfil()">PERFIL</button>
                <button class="nav-btn" onclick="supabaseClient.auth.signOut().then(() => window.location.href='index.html')" style="color:#ff4444;">SALIR</button>
            </div>
        </div>

        <div class="content-area">
            <div class="top-bar">
                <div class="resource-item"><span class="res-value" id="res-metal">0</span><br><small>FERRUM</small></div>
                <div class="resource-item"><span class="res-value" id="res-silice">0</span><br><small>SÍLICE</small></div>
                <div class="resource-item"><span class="res-value" id="res-deuterio">0</span><br><small>H3</small></div>
            </div>

            <div id="sec-resources" class="game-section active">
                <div class="building-grid" id="resources-list"></div>
            </div>

            <div id="sec-research" class="game-section">
                <div class="building-grid" id="research-list"></div>
            </div>

            <div id="sec-forum" class="game-section">
                <div class="forum-container">
                    <div id="forum-list-view">
                        <h2 style="font-family:'Orbitron'; color:var(--neon-blue); margin-bottom:20px;">TERMINAL DE DISCUSIÓN</h2>
                        
                        <div style="background:rgba(0,0,0,0.2); padding:15px; border-radius:10px; margin-bottom:20px;">
                            <input type="text" id="topic-title-input" class="forum-input" placeholder="Asunto...">
                            <textarea id="topic-body-input" class="forum-input" placeholder="Mensaje..."></textarea>
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <input type="file" id="forum-image-input" accept="image/*" style="font-size:0.7rem;" onchange="processFile(this)">
                                <button onclick="guardarNuevoTema()" style="background:var(--neon-blue); border:none; padding:10px 20px; border-radius:5px; cursor:pointer;">PUBLICAR</button>
                            </div>
                            <div id="preview-container" style="margin-top:10px;"></div>
                        </div>

                        <div id="topics-container"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-perfil" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:2000; align-items:center; justify-content:center;">
        <div style="background:var(--card-bg); border:1px solid var(--neon-blue); padding:30px; border-radius:15px; width:400px;">
            <h2 style="font-family:'Orbitron'; color:var(--neon-blue);">PERFIL</h2>
            <input type="text" id="edit-nickname" class="forum-input" style="margin-top:20px;">
            <button onclick="guardarPerfil()" class="nav-btn" style="background:var(--neon-blue); color:black;">GUARDAR</button>
            <button onclick="cerrarAjustesPerfil()" class="nav-btn">CERRAR</button>
        </div>
    </div>

    <div id="chat-bubble" onclick="toggleChat()"><i class="fas fa-comments"></i></div>
    <div id="chat-window">
        <div id="chat-messages"></div>
        <div style="padding:10px; display:flex; gap:5px;">
            <input type="text" id="chat-input" style="flex:1; background:#111; border:1px solid #333; color:white; padding:5px;">
            <button onclick="sendChatMessage()" style="background:var(--neon-purple); border:none; color:white; padding:5px 10px;">></button>
        </div>
    </div>

    <script>
        let currentImageBase64 = "";

        // --- OPTIMIZACIÓN DE IMAGEN (720P CALIDAD BAJA) ---
        function processFile(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    const max = 720;
                    if (width > height && width > max) { height *= max / width; width = max; }
                    else if (height > max) { width *= max / height; height = max; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    currentImageBase64 = canvas.toDataURL('image/jpeg', 0.5); // 0.5 = Baja calidad
                    document.getElementById('preview-container').innerHTML = `<img src="${currentImageBase64}" style="width:100px; border-radius:5px;">`;
                };
            };
            reader.readAsDataURL(file);
        }

        // --- LÓGICA DEL FORO CON LIKES ---
        async function loadForumTopics() {
            const { data } = await supabaseClient.from('forum_topics').select('*').order('created_at', { ascending: false });
            const container = document.getElementById('topics-container');
            container.innerHTML = '';
            data?.forEach(t => {
                const div = document.createElement('div');
                div.className = 'forum-topic-card animate__animated animate__fadeIn';
                div.innerHTML = `
                    <div style="display:flex; justify-content:space-between;">
                        <span style="color:var(--neon-blue); font-family:Orbitron;">${t.title}</span>
                        <small style="opacity:0.5;">${t.author_name}</small>
                    </div>
                    <p style="margin:10px 0; font-size:0.9rem;">${t.body}</p>
                    ${t.image_data ? `<img src="${t.image_data}" class="topic-img">` : ''}
                    <div class="like-section" onclick="darLike('${t.id}', ${t.likes || 0})">
                        <i class="fas fa-heart"></i> <span>${t.likes || 0} APOYO ESTELAR</span>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        async function darLike(id, current) {
            await supabaseClient.from('forum_topics').update({ likes: current + 1 }).eq('id', id);
            loadForumTopics();
        }

        async function guardarNuevoTema() {
            const title = document.getElementById('topic-title-input').value;
            const body = document.getElementById('topic-body-input').value;
            if(!title || !body) return;
            const { data: { user } } = await supabaseClient.auth.getUser();
            const author = user.user_metadata.full_name || user.email.split('@')[0];
            
            await supabaseClient.from('forum_topics').insert([{
                title, body, author_name: author, image_data: currentImageBase64, likes: 0
            }]);
            
            document.getElementById('topic-title-input').value = '';
            document.getElementById('topic-body-input').value = '';
            document.getElementById('preview-container').innerHTML = '';
            currentImageBase64 = "";
            loadForumTopics();
        }

        // --- RESTO DE FUNCIONES (SISTEMA DE JUEGO) ---
        function showSection(id) {
            document.querySelectorAll('.game-section').forEach(s => s.classList.remove('active'));
            document.getElementById('sec-'+id).classList.add('active');
            if(id === 'forum') loadForumTopics();
        }

        function toggleChat() {
            const win = document.getElementById('chat-window');
            win.style.display = win.style.display === 'flex' ? 'none' : 'flex';
        }

        async function actualizarRecursos() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            const { data } = await supabaseClient.from('players').select('*').eq('id', user.id).single();
            if(data) {
                document.getElementById('res-metal').innerText = Math.floor(data.metal);
                document.getElementById('res-silice').innerText = Math.floor(data.silicio);
                document.getElementById('res-deuterio').innerText = Math.floor(data.deuterio);
            }
        }

        function abrirAjustesPerfil() { 
            document.getElementById('modal-perfil').style.display = 'flex'; 
        }
        function cerrarAjustesPerfil() { 
            document.getElementById('modal-perfil').style.display = 'none'; 
        }

        // Init
        setInterval(actualizarRecursos, 5000);
        actualizarRecursos();
        loadForumTopics();
    </script>
</body>
</html>
