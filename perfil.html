<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOID ECHOS | Comando Central</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://ojytjhamrmmuaoeflmrh.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_oRK9yB9kg3o-x28YP0F9Jw_izkkkEtz';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function validarAcceso() {
            const { data: { user }, error } = await supabaseClient.auth.getUser();
            if (error || !user) {
                window.location.href = 'index.html';
            }
        }
        validarAcceso();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-purple: #bc13fe;
            --dark-bg: #0a0b10;
            --card-bg: rgba(16, 18, 27, 0.9);
            --wiki-gold: #ffd700;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Share Tech Mono', monospace;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(188, 19, 254, 0.05) 0%, transparent 80%),
                url('https://www.transparenttextures.com/patterns/stardust.png');
            background-attachment: fixed;
            min-height: 100vh;
        }

        .main-container { display: flex; flex-direction: row; min-height: 100vh; padding: 20px; gap: 20px; }
        .sidebar { width: 250px; height: calc(100vh - 40px); position: sticky; top: 20px; background: var(--card-bg); border: 1px solid rgba(0, 242, 255, 0.2); border-radius: 15px; padding: 20px; display: flex; flex-direction: column; backdrop-filter: blur(10px); z-index: 100; }
        .content-area { flex: 1; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
        .top-bar { position: sticky; top: 0; background: rgba(10, 11, 16, 0.95); border: 1px solid rgba(0, 242, 255, 0.2); border-radius: 15px; padding: 15px 20px; display: flex; justify-content: space-around; align-items: center; backdrop-filter: blur(15px); z-index: 90; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

        /* Estilos Sidebar */
        .nav-btn { background: transparent; border: 1px solid rgba(0, 242, 255, 0.1); color: white; padding: 15px; margin-bottom: 10px; border-radius: 8px; cursor: pointer; transition: all 0.3s; text-align: left; font-family: 'Orbitron', sans-serif; font-size: 0.8rem; display: flex; align-items: center; gap: 10px; }
        .nav-btn:hover, .nav-btn.active { background: rgba(0, 242, 255, 0.1); border-color: var(--neon-blue); box-shadow: 0 0 15px rgba(0, 242, 255, 0.2); }

        /* Estilos Chat */
        #chat-bubble { position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; background: var(--neon-purple); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 0 20px var(--neon-purple); z-index: 1000; transition: transform 0.3s; }
        #chat-window { position: fixed; bottom: 90px; right: 20px; width: 350px; height: 450px; background: var(--card-bg); border: 1px solid var(--neon-purple); border-radius: 15px; display: none; flex-direction: column; backdrop-filter: blur(20px); z-index: 1000; overflow: hidden; }
        #chat-header { padding: 15px; background: rgba(188, 19, 254, 0.2); border-bottom: 1px solid var(--neon-purple); display: flex; justify-content: space-between; font-family: 'Orbitron'; font-size: 0.8rem; }
        #chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; font-size: 0.85rem; }
        .msg { background: rgba(255,255,255,0.05); padding: 8px; border-radius: 5px; border-left: 2px solid var(--neon-purple); }
        #chat-input-area { padding: 10px; display: flex; gap: 5px; background: rgba(0,0,0,0.3); }
        #chat-input-area input { flex: 1; background: transparent; border: 1px solid #444; color: white; padding: 8px; border-radius: 5px; font-family: inherit; }
        #chat-input-area button { background: var(--neon-purple); border: none; color: white; padding: 0 15px; border-radius: 5px; cursor: pointer; }

        /* Modal Perfil */
        .avatar-option { width: 100%; cursor: pointer; border: 2px solid transparent; border-radius: 5px; transition: 0.3s; }
        .avatar-option:hover { border-color: var(--neon-blue); }
        .avatar-option.selected { border-color: var(--neon-blue); background: rgba(0, 242, 255, 0.2); }

        /* Recursos y Grid */
        .resource-item { display: flex; flex-direction: column; align-items: center; }
        .res-label { font-size: 0.6rem; color: var(--neon-blue); }
        .res-value { font-family: 'Orbitron', sans-serif; font-size: 1rem; text-shadow: 0 0 10px var(--neon-blue); }
        .game-section { display: none; }
        .game-section.active { display: block; }
        .building-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .building-card { background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; overflow: hidden; }
        .building-img { width: 100%; height: 160px; object-fit: cover; }
        .building-info { padding: 20px; }
        .btn-upgrade { width: 100%; padding: 12px; background: transparent; border: 1px solid var(--neon-blue); color: var(--neon-blue); font-family: 'Orbitron', sans-serif; cursor: pointer; border-radius: 5px; }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="sidebar">
            <h2 style="font-family:'Orbitron'; color:var(--neon-blue); margin-bottom:30px; text-align:center; font-size: 1.2rem;">VOID ECHOS</h2>
            <button class="nav-btn active" onclick="showSection('resources')"><i class="fas fa-microchip"></i> RECURSOS</button>
            <button class="nav-btn" onclick="showSection('research')"><i class="fas fa-flask"></i> INVESTIGACIÓN</button>
            <button class="nav-btn" onclick="showSection('fleet')"><i class="fas fa-rocket"></i> ASTILLERO</button>
            
            <div style="margin-top:auto;">
                <button class="nav-btn" onclick="abrirAjustesPerfil()">
                    <i class="fas fa-user-circle"></i> PERFIL 
                    <i class="fas fa-cog" style="font-size: 0.7rem; margin-left: auto; opacity: 0.6;"></i>
                </button>
                <button class="nav-btn" onclick="supabaseClient.auth.signOut().then(() => window.location.href='index.html')" style="border-color: #ff4444; color: #ff4444; width: 100%;">
                    <i class="fas fa-power-off"></i> SALIR
                </button>
            </div>
        </div>

        <div class="content-area">
            <div class="top-bar">
                <div class="resource-item"><span class="res-label">FERRUM</span><span class="res-value" id="res-metal">0</span></div>
                <div class="resource-item"><span class="res-label">SÍLICE</span><span class="res-value" id="res-silice">0</span></div>
                <div class="resource-item"><span class="res-label">ISÓTOPO-H3</span><span class="res-value" id="res-deuterio">0</span></div>
                <div class="resource-item"><span class="res-label">ENERGÍA</span><span class="res-value" id="res-energia" style="color:#ffea00;">0</span></div>
            </div>

            <div id="sec-resources" class="game-section active">
                <div class="building-grid" id="resources-list"></div>
            </div>
            <div id="sec-research" class="game-section">
                <div class="building-grid" id="research-list"></div>
            </div>
        </div>
    </div>

    <div id="modal-perfil" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:2000; backdrop-filter: blur(10px); align-items:center; justify-content:center;">
        <div style="background:var(--card-bg); border:1px solid var(--neon-blue); padding:30px; border-radius:15px; width:90%; max-width:400px;">
            <h2 style="font-family:'Orbitron'; color:var(--neon-blue); margin-bottom:20px; font-size:1.1rem;">AJUSTES DE OPERATIVO</h2>
            
            <label style="font-size:0.7rem; color:var(--neon-blue);">NICKNAME</label>
            <input type="text" id="edit-nickname" style="width:100%; background:rgba(255,255,255,0.05); border:1px solid #444; color:white; padding:10px; margin-bottom:15px; border-radius:5px;">

            <label style="font-size:0.7rem; color:var(--neon-blue);">NUEVA CONTRASEÑA</label>
            <input type="password" id="edit-password" placeholder="Mín. 6 caracteres" style="width:100%; background:rgba(255,255,255,0.05); border:1px solid #444; color:white; padding:10px; margin-bottom:15px; border-radius:5px;">

            <label style="font-size:0.7rem; color:var(--neon-blue);">AVATAR DE FLOTA</label>
            <div id="avatar-selector" style="display:grid; grid-template-columns: repeat(4, 1fr); gap:10px; margin:10px 0 20px 0;">
                <img src="https://api.dicebear.com/7.x/bottts/svg?seed=1" onclick="selectAvatar(this)" class="avatar-option">
                <img src="https://api.dicebear.com/7.x/bottts/svg?seed=2" onclick="selectAvatar(this)" class="avatar-option">
                <img src="https://api.dicebear.com/7.x/bottts/svg?seed=3" onclick="selectAvatar(this)" class="avatar-option">
                <img src="https://api.dicebear.com/7.x/bottts/svg?seed=4" onclick="selectAvatar(this)" class="avatar-option">
            </div>

            <div style="display:flex; gap:10px;">
                <button onclick="guardarPerfil()" style="flex:1; background:var(--neon-blue); color:black; border:none; padding:12px; border-radius:5px; cursor:pointer; font-family:'Orbitron'; font-weight:bold;">GUARDAR</button>
                <button onclick="cerrarAjustesPerfil()" style="flex:1; background:transparent; border:1px solid #ff4444; color:#ff4444; padding:12px; border-radius:5px; cursor:pointer;">X</button>
            </div>
        </div>
    </div>

    <div id="chat-bubble" onclick="toggleChat()"><i class="fas fa-comments"></i></div>
    <div id="chat-window">
        <div id="chat-header">
            <span>COMUNICACIONES</span>
            <span id="online-count" style="cursor:pointer" title="Ver personal">Online: 1</span>
        </div>
        <div id="chat-messages"></div>
        <div id="chat-input-area">
            <input type="text" id="chat-input" placeholder="Escribir..." onkeypress="if(event.key==='Enter') sendChatMessage()">
            <button onclick="sendChatMessage()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        // --- CONFIGURACIÓN PERFIL ---
        let avatarSeleccionado = "";
        function abrirAjustesPerfil() {
            document.getElementById('modal-perfil').style.display = 'flex';
            supabaseClient.auth.getUser().then(({data: {user}}) => {
                document.getElementById('edit-nickname').value = user.user_metadata.full_name || user.email.split('@')[0];
            });
        }
        function cerrarAjustesPerfil() { document.getElementById('modal-perfil').style.display = 'none'; }
        function selectAvatar(el) {
            document.querySelectorAll('.avatar-option').forEach(img => img.classList.remove('selected'));
            el.classList.add('selected');
            avatarSeleccionado = el.src;
        }
        async function guardarPerfil() {
            const nuevoNick = document.getElementById('edit-nickname').value;
            const nuevaPass = document.getElementById('edit-password').value;
            const { error: err1 } = await supabaseClient.auth.updateUser({ data: { full_name: nuevoNick, avatar_url: avatarSeleccionado } });
            if (nuevaPass.length >= 6) await supabaseClient.auth.updateUser({ password: nuevaPass });
            if (!err1) { alert("Perfil actualizado"); cerrarAjustesPerfil(); }
        }

        // --- LÓGICA CHAT ---
        const chatSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3');
        function toggleChat() {
            const win = document.getElementById('chat-window');
            win.style.display = win.style.display === 'flex' ? 'none' : 'flex';
            if(win.style.display === 'flex') scrollToBottom();
        }
        function verQuienesEstanOnline() {
            const state = supabaseClient.channel('online_users').presenceState();
            const users = [];
            Object.keys(state).forEach(id => state[id].forEach(p => users.push(p.user.split('@')[0])));
            alert("OPERATIVOS: " + [...new Set(users)].join(", "));
        }
        async function sendChatMessage() {
            const input = document.getElementById('chat-input');
            if(!input.value.trim()) return;
            const { data: { user } } = await supabaseClient.auth.getUser();
            await supabaseClient.from('chat_messages').insert([{
                user_email: user.user_metadata.full_name || user.email.split('@')[0],
                message: input.value
            }]);
            input.value = '';
        }
        function loadChatRealtime() {
            supabaseClient.from('chat_messages').select('*').order('created_at', { ascending: true }).limit(50).then(({ data }) => {
                if(data) data.forEach(m => appendMessage(m, false));
                scrollToBottom();
            });
            supabaseClient.channel('public:chat_messages').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_messages' }, 
                payload => { appendMessage(payload.new, true); scrollToBottom(); }).subscribe();
            
            const pres = supabaseClient.channel('online_users');
            pres.on('presence', { event: 'sync' }, () => {
                document.getElementById('online-count').innerText = `Online: ${Object.keys(pres.presenceState()).length}`;
                document.getElementById('online-count').onclick = verQuienesEstanOnline;
            }).subscribe(async (s) => {
                if (s === 'SUBSCRIBED') {
                    const { data: { user } } = await supabaseClient.auth.getUser();
                    await pres.track({ user: user.email });
                }
            });
        }
        async function appendMessage(msg, sound) {
            const container = document.getElementById('chat-messages');
            const div = document.createElement('div');
            const admins = ['admin', 'tu_nickname']; // Añade aquí los nombres admin
            const isAdmin = admins.includes(msg.user_email);
            div.className = 'msg animate__animated animate__fadeInUp';
            if (isAdmin) { div.style.borderColor = 'var(--wiki-gold)'; div.style.background = 'rgba(255,215,0,0.05)'; }
            const safeMsg = msg.message.replace(/</g, "&lt;");
            div.innerHTML = `<b style="color:${isAdmin?'var(--wiki-gold)':'var(--neon-blue)'}">${msg.user_email}</b> ${safeMsg}`;
            container.appendChild(div);
            if (sound) { chatSound.currentTime = 0; chatSound.play().catch(()=>{}); }
        }
        function scrollToBottom() { const c = document.getElementById('chat-messages'); if(c) c.scrollTop = c.scrollHeight; }

        // --- LÓGICA JUEGO ---
        const game = {
            buildings: [
                { id: 'minaFe', section: 'resources', name: 'Mina de Ferrum', lore: 'Extractor magnético.', img: 'https://via.placeholder.com/300x160/0a0b10/00f2ff?text=FERRUM' },
                { id: 'minaSi', section: 'resources', name: 'Sintetizador de Sílice', lore: 'Procesa arena estelar.', img: 'https://via.placeholder.com/300x160/0a0b10/00f2ff?text=SILICE' },
                { id: 'plantaSolar', section: 'resources', name: 'Matriz Solar', lore: 'Absorbe radiación.', img: 'https://via.placeholder.com/300x160/0a0b10/00f2ff?text=ENERGIA' }
            ]
        };
        let userResources = { metal: 0, silicio: 0, deuterio: 0 };
        let dbBuildingsCache = [];

        function showSection(id) {
            document.querySelectorAll('.game-section, .nav-btn').forEach(e => e.classList.remove('active'));
            document.getElementById('sec-' + id).classList.add('active');
            event.currentTarget.classList.add('active');
            renderList(id);
        }

        function renderList(section) {
            const container = document.getElementById(section + '-list');
            if (!container) return; container.innerHTML = '';
            game.buildings.filter(b => b.section === section).forEach(b => {
                container.innerHTML += `<div class="building-card">
                    <img src="${b.img}" class="building-img">
                    <div class="building-info">
                        <h3 class="building-name">${b.name}</h3>
                        <p style="font-size:0.8rem; color:#888; margin:10px 0;">${b.lore}</p>
                        <button class="btn-upgrade">MEJORAR</button>
                    </div>
                </div>`;
            });
        }

        async function syncData() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            const { data } = await supabaseClient.from('players').select('*').eq('id', user.id).single();
            if (data) {
                document.getElementById('res-metal').innerText = Math.floor(data.metal);
                document.getElementById('res-silice').innerText = Math.floor(data.silicio);
            }
        }

        (async () => {
            await syncData();
            loadChatRealtime();
            renderList('resources');
            setInterval(syncData, 5000);
        })();
    </script>
</body>
</html>
