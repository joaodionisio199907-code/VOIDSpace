<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOID ECHOS</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        // --- CONFIGURACIÓN SUPABASE ---
        const SUPABASE_URL = 'https://ojytjhamrmmuaoeflmrh.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_oRK9yB9kg3o-x28YP0F9Jw_izkkkEtz';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // --- SISTEMA ANTI-CHEAT INTEGRADO ---
        const AntiCheat = {
            isValidAmount: (amount) => !isNaN(amount) && amount >= 0,
            init: () => console.log("🛡️ Escudos Anti-Cheat Activos")
        };

        async function validarAcceso() {
            const { data: { user }, error } = await supabaseClient.auth.getUser();
            if (error || !user) { window.location.href = 'index.html'; }
        }
        validarAcceso();
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --neon-blue: #00f2ff; --neon-purple: #bc13fe; --dark-bg: #0a0b10; --card-bg: rgba(16, 18, 27, 0.9); }
        body { background-color: var(--dark-bg); color: white; font-family: 'Share Tech Mono', monospace; margin: 0; }
        .main-container { display: flex; min-height: 100vh; padding: 20px; gap: 20px; }
        .sidebar { width: 250px; background: var(--card-bg); border: 1px solid rgba(0, 242, 255, 0.2); border-radius: 15px; padding: 20px; }
        .content-area { flex: 1; display: flex; flex-direction: column; gap: 20px; }
        .top-bar { background: rgba(10, 11, 16, 0.95); border: 1px solid rgba(0, 242, 255, 0.2); border-radius: 15px; padding: 15px; display: flex; justify-content: space-around; }
        .nav-btn { background: transparent; border: 1px solid rgba(0,242,255,0.1); color: white; padding: 12px; margin-bottom: 8px; border-radius: 8px; cursor: pointer; width: 100%; font-family: 'Orbitron'; }
        .nav-btn.active { border-color: var(--neon-blue); background: rgba(0,242,255,0.1); }
        .game-section { display: none; }
        .game-section.active { display: block; }
        .building-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        
        /* Animación Resta */
        .recurso-resta { position: fixed; color: #ff4444; font-weight: bold; font-family: 'Orbitron'; font-size: 1.2rem; pointer-events: none; animation: flotarResta 1.5s ease-out forwards; z-index: 9999; }
        @keyframes flotarResta { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-50px); } }

        /* Hangar y Cola */
        .shipyard-layout { display: grid; grid-template-columns: 1fr 300px; gap: 20px; }
        .ship-card { background: var(--card-bg); border: 1px solid #333; padding: 15px; border-radius: 10px; }
        .queue-container { background: var(--card-bg); border: 1px solid var(--neon-purple); padding: 15px; border-radius: 10px; }
        .queue-item { background: rgba(255,255,255,0.05); padding: 10px; margin-bottom: 10px; border-radius: 5px; border-left: 3px solid var(--neon-purple); }
        .hangar-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin-top: 10px; }
        .hangar-item { background: #111; padding: 10px; border-radius: 5px; text-align: center; border: 1px solid #222; }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="sidebar">
            <h2 style="font-family:'Orbitron'; color:var(--neon-blue); text-align:center;">VOID ECHOS</h2>
            <button class="nav-btn active" onclick="showSection('resources')">RECURSOS</button>
            <button class="nav-btn" onclick="showSection('fleet')">ASTILLERO</button>
        </div>

        <div class="content-area">
            <div class="top-bar">
                <div id="cont-metal">FERRUM: <span id="res-metal">0</span></div>
                <div id="cont-silice">SÍLICE: <span id="res-silice">0</span></div>
            </div>

            <div id="sec-resources" class="game-section active">
                <div class="building-grid" id="resources-list">
                    <p>Usa la sección ASTILLERO para probar las naves.</p>
                </div>
            </div>

            <div id="sec-fleet" class="game-section">
                <div class="shipyard-layout">
                    <div>
                        <div class="building-grid" id="fleet-list-container"></div>
                        <div style="margin-top:20px;">
                            <h3 style="font-family:Orbitron; color:var(--neon-blue);">HANGAR</h3>
                            <div id="hangar-grid" class="hangar-grid"></div>
                        </div>
                    </div>
                    <div class="queue-container">
                        <h3 style="font-family:Orbitron; font-size:0.8rem; color:var(--neon-purple);">COLA DE PRODUCCIÓN</h3>
                        <div id="ship-queue-list"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- VARIABLES ---
        const NAVES_DISPONIBLES = [
            { id: 'cazador_l', name: 'CAZADOR LIGERO', metal: 3000, silicio: 1000, time: 15 },
            { id: 'carguero_p', name: 'CARGUERO PEQUEÑO', metal: 2000, silicio: 2000, time: 25 }
        ];

        let userResources = { metal: 0, silicio: 0 };
        let shipQueue = [];
        let shipTimerInterval = null;

        // --- ACTUALIZACIÓN DE INTERFAZ ---
        function actualizarInterfazRecursos() {
            document.getElementById('res-metal').innerText = Math.floor(userResources.metal);
            document.getElementById('res-silice').innerText = Math.floor(userResources.silicio);
        }

        function animarResta(idElemento, cantidad) {
            const el = document.getElementById(idElemento);
            const rect = el.getBoundingClientRect();
            const anima = document.createElement('div');
            anima.className = 'recurso-resta';
            anima.innerText = `-${cantidad}`;
            anima.style.left = rect.left + "px";
            anima.style.top = rect.top + "px";
            document.body.appendChild(anima);
            setTimeout(() => anima.remove(), 1500);
        }

        // --- NAVEGACIÓN ---
        function showSection(id) {
            document.querySelectorAll('.game-section').forEach(s => s.classList.remove('active'));
            document.getElementById('sec-' + id).classList.add('active');
            if(id === 'fleet') { renderAstillero(); loadHangar(); syncShipQueueFromDB(); }
        }

        // --- LÓGICA DE NAVES ---
        function renderAstillero() {
            const container = document.getElementById('fleet-list-container');
            container.innerHTML = NAVES_DISPONIBLES.map(ship => `
                <div class="ship-card">
                    <h4>${ship.name}</h4>
                    <p>Coste: ${ship.metal} M / ${ship.silicio} S</p>
                    <input type="number" id="qty-${ship.id}" value="1" min="1" style="width:50px; background:#000; color:#fff; border:1px solid #444;">
                    <button class="nav-btn" onclick="ordenarNave('${ship.id}')">CONSTRUIR</button>
                </div>
            `).join('');
        }

        async function ordenarNave(id) {
            const qty = parseInt(document.getElementById(`qty-${id}`).value);
            const ship = NAVES_DISPONIBLES.find(s => s.id === id);
            const costM = ship.metal * qty;
            const costS = ship.silicio * qty;

            if (userResources.metal >= costM && userResources.silicio >= costS) {
                const { data: { user } } = await supabaseClient.auth.getUser();

                // 1. Restar en DB
                const { error } = await supabaseClient.from('players').update({
                    metal: userResources.metal - costM,
                    silicio: userResources.silicio - costS
                }).eq('id', user.id);

                if (error) return alert("Error al conectar con DB");

                // 2. Efecto visual instantáneo
                animarResta('cont-metal', costM);
                animarResta('cont-silice', costS);
                userResources.metal -= costM;
                userResources.silicio -= costS;
                actualizarInterfazRecursos();

                // 3. Añadir a cola en DB
                let baseTime = new Date();
                if (shipQueue.length > 0) baseTime = new Date(shipQueue[shipQueue.length-1].finish_at);
                const finishAt = new Date(baseTime.getTime() + (ship.time * qty * 1000)).toISOString();

                await supabaseClient.from('ship_queue').insert([{
                    user_id: user.id, ship_id: ship.id, quantity: qty, finish_at: finishAt
                }]);

                syncShipQueueFromDB();
            } else {
                alert("Recursos insuficientes");
            }
        }

        async function syncShipQueueFromDB() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            const { data } = await supabaseClient.from('ship_queue')
                .select('*').eq('user_id', user.id).order('finish_at', { ascending: true });
            
            shipQueue = data || [];
            updateShipQueueUI();
            if (shipQueue.length > 0 && !shipTimerInterval) processShipQueue();
        }

        function updateShipQueueUI() {
            const container = document.getElementById('ship-queue-list');
            if (shipQueue.length === 0) {
                container.innerHTML = "<p style='opacity:0.3; font-size:0.7rem;'>Sin actividad</p>";
                return;
            }
            container.innerHTML = shipQueue.map((q, i) => `
                <div class="queue-item">
                    <b>${q.quantity}x ${q.ship_id}</b><br>
                    <small id="timer-${q.id}">${i === 0 ? 'Procesando...' : 'En espera'}</small>
                </div>
            `).join('');
        }

        function processShipQueue() {
            if (shipQueue.length === 0) return;
            
            shipTimerInterval = setInterval(async () => {
                const current = shipQueue[0];
                const restante = Math.floor((new Date(current.finish_at) - new Date()) / 1000);
                
                const timerEl = document.getElementById(`timer-${current.id}`);
                if (timerEl) timerEl.innerText = `Finaliza en: ${restante}s`;

                if (restante <= 0) {
                    clearInterval(shipTimerInterval);
                    shipTimerInterval = null;
                    
                    // Finalizar construcción
                    await registrarNaveEnBD(current.ship_id, current.quantity);
                    await supabaseClient.from('ship_queue').delete().eq('id', current.id);
                    
                    syncShipQueueFromDB();
                    loadHangar();
                }
            }, 1000);
        }

        async function registrarNaveEnBD(shipId, quantity) {
            const { data: { user } } = await supabaseClient.auth.getUser();
            const { data: existing } = await supabaseClient.from('user_fleet')
                .select('*').eq('user_id', user.id).eq('ship_id', shipId).single();
            
            if (existing) {
                await supabaseClient.from('user_fleet').update({ quantity: existing.quantity + quantity }).eq('id', existing.id);
            } else {
                await supabaseClient.from('user_fleet').insert([{ user_id: user.id, ship_id: shipId, quantity: quantity }]);
            }
        }

        async function loadHangar() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            const { data: fleet } = await supabaseClient.from('user_fleet').select('*').eq('user_id', user.id);
            const container = document.getElementById('hangar-grid');
            if (!fleet || fleet.length === 0) {
                container.innerHTML = "Vacío";
                return;
            }
            container.innerHTML = fleet.map(f => `<div class="hangar-item"><b>${f.ship_id}</b><br>${f.quantity}</div>`).join('');
        }

        async function actualizarRecursosDesdeBD() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            const { data } = await supabaseClient.from('players').select('metal, silicio').eq('id', user.id).single();
            if (data) {
                userResources.metal = data.metal;
                userResources.silicio = data.silicio;
                actualizarInterfazRecursos();
            }
        }

        // --- INICIO ---
        (async () => {
            AntiCheat.init();
            await actualizarRecursosDesdeBD();
            setInterval(actualizarRecursosDesdeBD, 10000);
        })();
    </script>
</body>
</html>
